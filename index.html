<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mamba OS">
<meta name="theme-color" content="#0A0A0C">
<title>Mamba OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,200;0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--black:#0A0A0C;--char:#131318;--char2:#1B1B22;--char3:#25252E;--purple:#2B1E47;--purple2:#493275;--purple-lt:#9679D1;--gold:#E8B33A;--gold-dim:#9A7626;--ink:#EDE9E2;--ink-dim:#9B96A3;--ink-faint:#615C6B;--line:#26262F;--red:#B4483F;--green:#5E9B7A;--r:3px;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--black);color:var(--ink);font-family:'Newsreader',Georgia,serif;-webkit-text-size-adjust:100%;}
body{min-height:100vh;padding-bottom:calc(78px + env(safe-area-inset-bottom));}
h1,h2,h3,.dsp{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.05em;margin:0;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:'Newsreader',Georgia,serif;background:var(--char2);border:1px solid var(--line);color:var(--ink);border-radius:var(--r);padding:10px 11px;font-size:16px;width:100%;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple-lt);}
textarea{resize:vertical;min-height:70px;line-height:1.5;}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-faint) 50%),linear-gradient(135deg,var(--ink-faint) 50%,transparent 50%);background-position:calc(100% - 16px) 20px,calc(100% - 11px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
#launch{position:fixed;inset:0;z-index:200;background:var(--black);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s ease;}
#launch.gone{opacity:0;pointer-events:none;}
.quote-wrap{display:flex;flex-direction:column;align-items:center;padding:0 26px;}
.quote{font-family:'Newsreader',serif;font-weight:200;font-size:30px;line-height:1.3;color:#F2EFE9;text-align:center;}
.attrib{display:flex;align-items:center;gap:13px;margin-top:22px;font-family:'Oswald';font-size:10.5px;letter-spacing:.26em;color:var(--gold-dim);}
.attrib span{display:block;width:26px;height:1px;background:var(--gold-dim);opacity:.6;}
.launch-tap{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-family:'Oswald';font-size:10.5px;letter-spacing:.3em;color:var(--ink-faint);animation:pulse 2.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}
.launch-day{position:absolute;top:calc(26px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-family:'Oswald';font-size:11px;letter-spacing:.28em;color:var(--gold-dim);}
.topbar{padding:calc(16px + env(safe-area-inset-top)) 17px 13px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;background:rgba(10,10,12,.93);backdrop-filter:blur(12px);}
.tb-day{font-family:'Oswald';font-size:11px;letter-spacing:.2em;color:var(--gold-dim);}
.tb-title{font-family:'Oswald';font-size:23px;font-weight:600;letter-spacing:.04em;margin-top:1px;}
.tb-right{text-align:right;font-family:'JetBrains Mono';font-size:11px;color:var(--ink-faint);letter-spacing:.04em;}
.tb-right b{display:block;font-size:19px;color:var(--gold);font-weight:700;line-height:1.1;}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.screen{display:none;padding:16px 15px 24px;animation:fade .22s ease;}
.screen.on{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card{background:var(--char);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:13px;}
.ct{font-family:'Oswald';font-size:11px;letter-spacing:.18em;color:var(--gold);margin-bottom:12px;}
.ct.p{color:var(--purple-lt);}
.sub{font-size:13px;color:var(--ink-faint);font-style:italic;line-height:1.5;}
.target{background:linear-gradient(100deg,var(--purple) 0%,var(--char2) 92%);border:1px solid var(--purple2);border-left:3px solid var(--gold);border-radius:var(--r);padding:13px 15px;margin-bottom:14px;}
.target .l{font-family:'Oswald';font-size:10px;letter-spacing:.16em;color:var(--gold);}
.target .v{font-size:18px;margin-top:3px;line-height:1.3;}
.target .v.empty{color:var(--ink-faint);font-style:italic;font-size:16px;}
.task{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid var(--line);}
.task:last-child{border-bottom:none;}
.ck{width:23px;height:23px;flex:0 0 23px;border:1.5px solid var(--gold-dim);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.ck.on{background:var(--gold);border-color:var(--gold);}
.ck.on::after{content:"✓";color:var(--black);font-size:13px;font-weight:700;font-family:'Oswald';}
.ck.sq{border-radius:3px;width:21px;height:21px;flex:0 0 21px;}
.tl{flex:1;font-size:16.5px;line-height:1.25;}
.tl small{display:block;color:var(--ink-faint);font-size:12.5px;font-style:italic;margin-top:2px;line-height:1.35;}
.task.done .tl{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:var(--gold-dim);}
.task.done .tl small{text-decoration:none;}
.task .go{font-family:'Oswald';font-size:9.5px;letter-spacing:.14em;color:var(--purple-lt);border:1px solid var(--purple2);padding:4px 8px;border-radius:20px;}
.xbtn{color:var(--ink-faint);font-size:19px;padding:0 4px;line-height:1;}
.bp{width:100%;background:var(--gold);color:var(--black);padding:13px;border-radius:var(--r);font-family:'Oswald';font-size:12.5px;letter-spacing:.12em;font-weight:600;text-transform:uppercase;}
.bg{width:100%;background:transparent;color:var(--ink-dim);border:1px solid var(--line);padding:12px;border-radius:var(--r);font-family:'Oswald';font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;}
.bpp{width:100%;background:var(--purple2);color:#fff;padding:12px;border-radius:var(--r);font-family:'Oswald';font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;}
.bsm{font-family:'Oswald';font-size:10px;letter-spacing:.12em;color:var(--gold-dim);text-transform:uppercase;}
.brow{display:flex;gap:9px;}
.cbtn{flex:1;text-align:center;text-decoration:none;font-family:'Oswald';font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-dim);padding:12px 0;border-radius:var(--r);background:rgba(232,179,58,.07);}
.f{margin-bottom:11px;}
.f label{display:block;font-family:'Oswald';font-size:10px;letter-spacing:.13em;color:var(--ink-faint);margin-bottom:5px;text-transform:uppercase;}
.f2{display:flex;gap:9px;}
.f2>div{flex:1;}
.seg{display:flex;gap:5px;overflow-x:auto;padding-bottom:11px;margin-bottom:3px;scrollbar-width:none;}
.seg::-webkit-scrollbar{display:none;}
.seg button{flex:0 0 auto;background:var(--char2);border:1px solid var(--line);color:var(--ink-dim);font-family:'Oswald';font-size:10.5px;letter-spacing:.1em;padding:8px 13px;border-radius:20px;text-transform:uppercase;}
.seg button.on{background:var(--gold);border-color:var(--gold);color:var(--black);}
.lr{display:flex;gap:12px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);}
.lr:last-child{border-bottom:none;}
.lr-date{flex:0 0 46px;text-align:center;}
.lr-date .d{font-family:'Oswald';font-size:19px;font-weight:600;line-height:1;color:var(--gold);}
.lr-date .m{font-family:'Oswald';font-size:9.5px;letter-spacing:.13em;color:var(--ink-faint);margin-top:2px;}
.lr-mid{flex:1;min-width:0;}
.lr-mid b{font-family:'Oswald';font-size:15px;letter-spacing:.02em;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lr-mid span{font-size:12.5px;color:var(--ink-faint);font-style:italic;}
.lr-next{flex:0 0 auto;max-width:38%;text-align:right;font-family:'Oswald';font-size:9.5px;letter-spacing:.09em;color:var(--purple-lt);line-height:1.3;text-transform:uppercase;}
.lr-next.done{color:var(--green);}
.met{margin-bottom:13px;}
.met:last-child{margin-bottom:0;}
.met-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.met-n{font-family:'Oswald';font-size:11.5px;letter-spacing:.07em;}
.met-v{font-family:'JetBrains Mono';font-size:12px;color:var(--ink-faint);}
.met-v b{color:var(--gold);}
.trk{height:6px;background:var(--char2);border-radius:4px;overflow:hidden;border:1px solid var(--line);}
.fil{height:100%;background:linear-gradient(90deg,var(--purple2),var(--gold));transition:width .35s;}
.fil.p{background:linear-gradient(90deg,var(--purple),var(--purple-lt));}
.fil.g{background:linear-gradient(90deg,var(--green),#7FC49F);}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);margin-top:6px;}
.stp button{background:var(--char2);color:var(--gold);width:34px;height:30px;font-size:17px;line-height:1;}
.stp input{border:none;width:52px;text-align:center;background:var(--char);padding:5px 0;font-size:14px;font-family:'JetBrains Mono';-moz-appearance:textfield;}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.wk{display:flex;gap:6px;}
.wk div{flex:1;text-align:center;padding:9px 0;border-radius:var(--r);font-family:'JetBrains Mono';font-size:11px;border:1px solid var(--line);background:var(--char2);color:var(--ink-faint);}
.wk div.on{border-color:var(--gold);background:rgba(232,179,58,.14);color:var(--gold);}
.ent{background:var(--char);border:1px solid var(--line);border-left:3px solid var(--sc,var(--ink-faint));border-radius:var(--r);padding:13px;margin-bottom:10px;}
.ent-top{display:flex;justify-content:space-between;gap:9px;align-items:flex-start;}
.ent-t{font-family:'Oswald';font-size:15.5px;font-weight:500;}
.pill{font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:20px;border:1px solid currentColor;white-space:nowrap;}
.ent-m{font-size:12.5px;color:var(--ink-faint);font-style:italic;margin-top:4px;}
.ent-b{font-size:14px;color:var(--ink-dim);margin-top:7px;line-height:1.5;}
.acts{display:flex;gap:15px;margin-top:9px;}
.rate{display:flex;gap:4px;}
.rate button{flex:1;height:28px;border:1px solid var(--line);background:var(--char2);border-radius:2px;font-family:'JetBrains Mono';font-size:10px;color:var(--ink-faint);}
.rate button.on{background:var(--gold);border-color:var(--gold);color:var(--black);font-weight:700;}
.tags{display:flex;flex-wrap:wrap;gap:5px;}
.tag{font-family:'Oswald';font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:20px;border:1px solid var(--purple2);color:var(--purple-lt);}
.tag.g{border-color:var(--gold-dim);color:var(--gold);}
.tagsel{display:flex;flex-wrap:wrap;gap:5px;}
.tagsel button{font-family:'Oswald';font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:20px;border:1px solid var(--line);background:var(--char2);color:var(--ink-faint);}
.tagsel button.on{border-color:var(--gold);background:rgba(232,179,58,.14);color:var(--gold);}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.st{background:var(--char2);border:1px solid var(--line);border-radius:var(--r);padding:12px;}
.st .n{font-family:'Oswald';font-size:25px;font-weight:600;color:var(--gold);line-height:1;}
.st .n.sm{font-size:20px;}
.st .n small{font-size:13px;color:var(--ink-faint);font-weight:400;}
.st .l{font-family:'Oswald';font-size:9.5px;letter-spacing:.13em;color:var(--ink-faint);margin-top:5px;text-transform:uppercase;}
.big{text-align:center;padding:6px 0 2px;}
.big .n{font-family:'Oswald';font-size:54px;font-weight:700;color:var(--gold);line-height:1;}
.big .l{font-family:'Oswald';font-size:10.5px;letter-spacing:.22em;color:var(--ink-faint);margin-top:6px;}
.mbg{position:fixed;inset:0;background:rgba(5,5,7,.8);z-index:100;display:none;align-items:flex-end;backdrop-filter:blur(3px);}
.mbg.on{display:flex;}
.mod{background:var(--char);border-top:1px solid var(--purple2);width:100%;max-height:90vh;overflow-y:auto;padding:18px 16px calc(30px + env(safe-area-inset-bottom));border-radius:12px 12px 0 0;animation:up .22s ease;}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.mod h3{font-size:16px;margin-bottom:15px;}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;}
.q{margin-bottom:15px;}
.q label{display:block;font-family:'Newsreader';font-style:italic;color:var(--gold);font-size:15.5px;margin-bottom:7px;line-height:1.35;}
.flag{background:rgba(180,72,63,.12);border:1px solid var(--red);border-radius:var(--r);padding:10px 12px;margin-bottom:13px;font-size:13.5px;color:#E5A9A3;line-height:1.45;}
.flag.gold{background:rgba(232,179,58,.1);border-color:var(--gold-dim);color:#E8CE9B;}
.carry{background:var(--char2);border-left:2px solid var(--purple2);padding:8px 11px;margin-bottom:8px;font-size:13px;color:var(--ink-dim);font-style:italic;}
.bk{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);}
.bk:last-child{border-bottom:none;}
.bkc{width:19px;height:19px;flex:0 0 19px;border:1.5px solid var(--gold-dim);border-radius:2px;}
.bkc.on{background:var(--gold);border-color:var(--gold);}
.bkc.on::after{content:"✓";color:var(--black);font-size:11px;display:block;text-align:center;line-height:16px;font-weight:700;font-family:'Oswald';}
.bki{flex:1;min-width:0;}
.bki b{font-size:14.5px;font-weight:500;}
.bki span{display:block;font-size:12px;color:var(--ink-faint);font-style:italic;}
.bkm{font-family:'JetBrains Mono';font-size:10px;color:var(--ink-faint);}
.acc{background:var(--char2);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-top:11px;}
.menu button{width:100%;display:flex;align-items:center;justify-content:space-between;padding:16px 2px;border-bottom:1px solid var(--line);text-align:left;}
.menu button:last-child{border-bottom:none;}
.menu .mi b{font-family:'Oswald';font-size:15px;font-weight:500;letter-spacing:.03em;display:block;}
.menu .mi span{font-size:12.5px;color:var(--ink-faint);font-style:italic;}
.menu .ar{color:var(--ink-faint);font-size:17px;}
.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(19,19,24,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:64px;color:var(--ink-faint);}
.tab.on{color:var(--gold);}
.tab .tt{font-family:'Oswald';font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;}
.tab svg{width:19px;height:19px;}
.empty{text-align:center;padding:26px 12px;color:var(--ink-faint);font-style:italic;font-size:14px;line-height:1.5;}
.hr{height:1px;background:var(--line);margin:15px 0;}
.note{font-size:12.5px;color:var(--ink-faint);font-style:italic;line-height:1.5;margin-top:8px;}
.back{font-family:'Oswald';font-size:10.5px;letter-spacing:.14em;color:var(--purple-lt);text-transform:uppercase;margin-bottom:13px;display:inline-block;}
.cairo{background:linear-gradient(140deg,var(--purple) 0%,var(--char) 75%);border:1px solid var(--purple2);border-radius:var(--r);padding:17px;margin-bottom:13px;}
.cairo .nm{font-family:'Oswald';font-size:30px;font-weight:700;letter-spacing:.18em;color:var(--gold);line-height:1;}
.cairo .fm{font-size:14px;color:var(--ink-dim);font-style:italic;margin-top:6px;}
.spon{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
.spon:last-child{border-bottom:none;}
.spon b{font-family:'Oswald';font-size:14px;font-weight:500;}
.spon .tr{font-size:11.5px;color:var(--ink-faint);font-style:italic;}
.spon .amt{font-family:'Oswald';font-size:15px;color:var(--gold);}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;}
</style>
</head>
<body>
<div id="launch" onclick="enterApp()">
  <div class="launch-day" id="launchDay"></div>
  <div class="quote-wrap">
    <div class="quote">Obsession beats talent.</div>
    <div class="attrib"><span></span>KOBE BRYANT &nbsp;·&nbsp; NO. 24<span></span></div>
  </div>
  <div class="launch-tap">TAP TO ENTER</div>
</div>

<div class="topbar">
  <div class="row">
    <div><div class="tb-day" id="tbDay">DAY 1 · WEEK 1</div><div class="tb-title" id="tbTitle">Today</div></div>
    <div class="tb-right"><b id="tbPct">0%</b>WEEK</div>
  </div>
</div>

<div class="screen on" id="s-today">
  <div class="target" onclick="go('review')">
    <div class="l">THIS WEEK'S ATTACK TARGET</div><div class="v" id="tgt">—</div>
  </div>
  <div class="card"><div class="ct" id="todayLabel">TODAY</div><div id="coreList"></div></div>
  <div class="card">
    <div class="ct">Also Today</div><div id="extraList"></div>
    <div class="f2" style="margin-top:11px;"><div><input id="newTask" placeholder="Add a task for today" onkeydown="if(event.key==='Enter')addExtra()"></div>
    <div style="flex:0 0 74px;"><button class="bp" style="padding:11px 0;" onclick="addExtra()">Add</button></div></div>
    <div class="note">Extras clear overnight. The core list always comes back.</div>
  </div>
  <div class="card">
    <div class="ct">Daily Notes</div>
    <textarea id="dayNotes" placeholder="What happened today. Who you talked to. What you noticed." oninput="saveNotes()" style="min-height:130px;"></textarea>
    <div class="note" id="notesSaved">Saved automatically to this date.</div>
    <div class="hr"></div><button class="bg" onclick="openPastNotes()">Read Past Notes</button>
  </div>
</div>

<div class="screen" id="s-events">
  <div class="seg" id="evSeg"></div>
  <div id="evBody"></div>
</div>

<div class="screen" id="s-build">
  <div class="seg" id="buildSeg"></div>
  <div id="buildBody"></div>
</div>

<div class="screen" id="s-review">
  <div class="seg" id="revSeg"></div>
  <div id="revBody"></div>
</div>

<div class="screen" id="s-other">
  <div id="otherMain">
    <div class="card"><div class="ct">Mamba Day</div><div id="mambaCountdown"></div></div>
    <div id="otherMenu"></div>
  </div>
  <div id="otherDetail" style="display:none;"></div>
</div>

<div class="tabs">
  <button class="tab on" data-s="today" onclick="go('today')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="tt">Today</span></button>
  <button class="tab" data-s="events" onclick="go('events')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="tt">Events</span></button>
  <button class="tab" data-s="build" onclick="go('build')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 3l7 7-4 4-7-7z"/><path d="M10 7L3 14v7h7l7-7"/></svg><span class="tt">Build</span></button>
  <button class="tab" data-s="review" onclick="go('review')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 4h14v16l-7-4-7 4V4z"/></svg><span class="tt">Review</span></button>
  <button class="tab" data-s="other" onclick="go('other')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span class="tt">Other</span></button>
</div>

 'Pitching':['Pitch CAIRO out loud in 60 seconds, recorded — watch it back','Write the one-sentence version 20 different ways, keep one','Pitch it to someone outside the industry and watch where they get confused','Rewrite the opening line so it leads with their problem, not your event','Practice the three objections you fear most, out loud','Pitch it to a friend and have them repeat it back — did it survive?'],

 'Deck & Proposal':['Rebuild the sponsor deck to 8 slides maximum','Redesign one slide until it could hang on a wall','Write the proposal one-pager with the price on page one','Study three sponsorship decks from real event brands, steal the structure','Make a version of the deck that works with no narration','Add one slide that proves an outcome, not an idea'],
 'Negotiation':['Write your walk-away number for every open deal','Practice saying "that does not work for us" with no follow-up sentence','List what you can trade that is not price','Rehearse the exclusivity conversation before it happens','Write the terms you will never give up, and keep them visible','Role-play the "can you do it cheaper" call'],

 'Budget & Finance':['Build the event budget before the venue is booked','Calculate the true break-even attendance','Model the downside: 40% of projected turnout','Track every dollar of one event to the receipt','Calculate cost per attendee and revenue per attendee','Write the payment timeline: when money leaves vs. when it lands'],
 'Content & Demand':['Ship one piece of content that shows the event, not the brand','Study how a sold-out event announced itself','Write three hooks for the next event announcement','Build the RSVP page and get five signups today','Shoot a 30-second cut from the last event','Map who could bring 20 people each, then ask one of them'],
 'Vendor Management':['Build a vendor list with backups for every category','Negotiate one rate down or one deliverable up','Write the vendor brief so it needs no phone call','Debrief one vendor after an event and ask what you did badly','Find one new vendor before you need them','Put every vendor confirmation in writing'],
 'Sponsorship Strategy':['Price the tiers against what a brand pays for equivalent reach','Write what each sponsor actually gets, in outcomes','Identify five brands that share your audience and none of your sponsors','Draft the renewal conversation before the first event happens','Build the post-event sponsor report template','Decide what you will never sell — the naming line, the data, the brand']
};

const STAGE_C={Lead:'#9B96A3',Pitched:'#9679D1','Proposal Sent':'#E8B33A','Deposit Paid':'#5E9B7A',Delivered:'#5E9B7A',Renewed:'#7FC49F',Lost:'#B4483F'};

const TYPE_C={'CAIRO':'#E8B33A','Client Event':'#9679D1','DJ Gig':'#5E9B7A','Mamba Day':'#493275'};
const EV_CHECK=[['scoped','Format & Budget Locked'],['venue','Venue Confirmed'],['sponsors','Sponsors Signed'],['deposit','Deposits Collected'],['promo','Promo Live'],['runsheet','Run-of-Show Built'],['delivered','Event Delivered'],['report','Sponsor Report Sent'],['paid','Final Payment Received']];
const DEBRIEF=[['turnout','Turnout'],['production','Production Quality'],['sponsor','Sponsor Satisfaction'],['content','Content Captured'],['data','Data Captured'],['profit','Profit']];

const DEFAULT_PREP={
 production:['Run-of-show finalized and shared','Vendor confirmations in writing','Venue walkthrough done','Power and load-in mapped','Staff roles assigned','Failure plan written','Photographer + videographer confirmed','Sponsor activations built and tested','Data capture ready (signup flow tested)','Payment status checked before doors'],
 gear:['DJ controller + laptop','Backup USB with full set','Speakers + subs','Mic + stand','Cables (redundant set)','Power strips + extension cords','Lighting','Signage + sponsor banners','Merch / product table','Cash box or payment reader']
};

/* =================== STATE =================== */
let S=null, evTab='events', buildTab='prep', revTab='weekly', otherOpen=null, evOpen=null, pipeOpen=null;
let prepState={production:[],gear:[]}, pendingDrills=[], accOpen=null;

function blank(){return{
 startDate:'2026-08-03', cairoFormat:'', days:{}, weeks:{}, reviews:{}, quarters:{},
 events:[], pipeline:[], reps:[], teardowns:[], sessions:[], crm:[], failures:[], books:{}, weekDrills:{},
 prep:JSON.parse(JSON.stringify(DEFAULT_PREP))
};}
function load(){try{const r=localStorage.getItem(KEY);S=r?Object.assign(blank(),JSON.parse(r)):blank();}catch(e){S=blank();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){console.error(e);}}
function uid(){return Math.random().toString(36).slice(2,10);}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
function iso(d){d=d||new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function parseD(s){return new Date(s+'T00:00:00');}
function money(n){return '$'+(+n||0).toLocaleString();}

function info(){const st=parseD(S.startDate),now=new Date();
 const dd=Math.floor((parseD(iso(now))-st)/864e5);
 return{day:dd+1,week:Math.max(1,Math.min(52,Math.floor(dd/7)+1)),dow:now.getDay()};}
function week(n){const k='w'+n;if(!S.weeks[k])S.weeks[k]={convos:0,hours:0,content:0,god:[false,false,false,false,false,false,false]};return S.weeks[k];}
function weekStart(n){const d=parseD(S.startDate);d.setDate(d.getDate()+(n-1)*7);return d;}
function inWeek(ds,n){if(!ds)return false;const s=weekStart(n),e=new Date(s);e.setDate(e.getDate()+7);const d=parseD(ds);return d>=s&&d<e;}
function day(k){k=k||iso();if(!S.days[k])S.days[k]={core:{},extras:[],notes:''};return S.days[k];}
function monthKey(){return MON[new Date().getMonth()];}
function monthBooks(){const b=BOOKS.filter(x=>x.m===monthKey());return b.length?b:[BOOKS[0],BOOKS[1]];}

function coreItems(){
 const dow=new Date().getDay(), read=monthBooks().map(b=>b.t).join(' or ');
 if(dow===0)return[
  {k:'god',n:'God Time',s:'30 min uninterrupted'},
  {k:'yoga',n:'Yoga',s:WORKOUT[0]},
  {k:'review',n:'Weekly Review',s:'Six questions',go:'review'},
  {k:'outreach',n:'Outreach',s:'1 message today'},
  {k:'vitamins',n:'Vitamins',s:'Vitamin D, Magnesium'},
  {k:'visual',n:'Visualization',s:''},
  {k:'reading',n:'Reading',s:read}];
 return[
  {k:'god',n:'God Time',s:'30 min uninterrupted'},
  {k:'workout',n:'Workout',s:WORKOUT[dow]},
  {k:'build',n:'Build Block',s:BLOCK[dow],go:'build'},
  {k:'outreach',n:'Outreach',s:'1 message today'},
  {k:'vitamins',n:'Vitamins',s:'Vitamin D, Magnesium'},
  {k:'visual',n:'Visualization',s:''},
  {k:'reading',n:'Reading',s:read}];
}

/* =================== DERIVED =================== */
function metrics(n){const w=week(n);
 return{
  outreach:S.crm.filter(c=>inWeek(c.lastTouch,n)).length + S.pipeline.filter(p=>inWeek(p.touchedOn,n)).length,
  convos:w.convos||0,
  pitches:S.pipeline.filter(p=>inWeek(p.pitchedOn,n)).length,
  hours:w.hours||0,
  reps:S.reps.filter(r=>inWeek(r.date,n)).length,
  teardown:S.teardowns.filter(t=>inWeek(t.date,n)).length,
  content:w.content||0,
  failures:S.failures.filter(f=>inWeek(f.date,n)).length
 };}
function weekPct(n){const m=metrics(n);let s=0,c=0;for(const k in TARGETS){s+=Math.min(1,(m[k]||0)/TARGETS[k].t);c++;}return Math.round(s/c*100);}
function evRevenue(e){return (e.sponsors||[]).reduce((s,x)=>s+(+x.amount||0),0) + (+e.ticketRev||0) + (+e.fee||0);}
function evCollected(e){return (e.sponsors||[]).reduce((s,x)=>s+(x.paid?(+x.amount||0):(x.deposit?(+x.amount||0)/2:0)),0) + (+e.ticketRev||0) + (e.feePaid?(+e.fee||0):0);}
function evProfit(e){return evRevenue(e)-(+e.cost||0);}
function totalAttendees(){return S.events.filter(e=>e.actualAttend).reduce((s,e)=>s+(+e.actualAttend||0),0);}
function totalCaptured(){return S.events.reduce((s,e)=>s+(+e.captured||0),0);}
function currentTarget(){const ks=Object.keys(S.reviews).map(k=>+k.slice(1)).sort((a,b)=>b-a);
 for(const n of ks){const r=S.reviews['w'+n];if(r&&r.weakness)return r.weakness;}return null;}
function prevReview(){const cur=info().week;const ks=Object.keys(S.reviews).map(k=>+k.slice(1)).filter(n=>n<cur).sort((a,b)=>b-a);
 return ks.length?S.reviews['w'+ks[0]]:null;}
function quarterInfo(){const now=new Date(),m=now.getMonth(),y=now.getFullYear();
 const qs=[{l:'Q1 · Aug–Oct',th:'Build CAIRO. First event on the ground.'},{l:'Q2 · Nov–Jan',th:'Prove it repeats. Sponsors renew.'},{l:'Q3 · Feb–Apr',th:'Trade up. First luxury credential.'},{l:'Q4 · May–Jul',th:'Referral work at real prices.'}];
 let i;if(m>=7&&m<=9)i=0;else if(m>=10||m<=0)i=1;else if(m>=1&&m<=3)i=2;else i=3;
 return{...qs[i],key:'q_'+(m>=7?y:y-1)+'_Q'+(i+1)};}
function quarterIntention(){const q=quarterInfo(),r=S.quarters[q.key];
 return{label:q.l,text:(r&&r.intention)?r.intention:q.th,set:!!(r&&r.intention)};}

/* =================== NAV / MODAL =================== */
function enterApp(){document.getElementById('launch').classList.add('gone');}
function go(name,keep){
 document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));
 document.getElementById('s-'+name).classList.add('on');
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.s===name));
 document.getElementById('tbTitle').textContent={today:'Today',events:'Events',build:'Build',review:'Review',other:'Other'}[name];
 if(name==='events'){if(!keep){evOpen=null;pipeOpen=null;}renderEvents();}
 if(name==='build')renderBuild();

}
function openModal(h){document.getElementById('mod').innerHTML=h;document.getElementById('mbg').classList.add('on');}
function closeModal(){document.getElementById('mbg').classList.remove('on');}
function askDelete(m){return confirm(m||'Delete this permanently? This cannot be undone.');}
function detailModal(title,sub,rows,delFn,extra){
 openModal(`<div class="mhead"><h3>${esc(title)}</h3><button class="xbtn" onclick="closeModal()">×</button></div>

 ${delFn?`<div class="hr"></div><button class="bg" style="color:var(--red);border-color:var(--red);" onclick="${delFn}">Delete This</button>`:''}`);

/* =================== TODAY =================== */
function renderToday(){
 const i=info(),d=day();
 document.getElementById('tbDay').textContent=`DAY ${i.day} · WEEK ${i.week}`;
 document.getElementById('launchDay').textContent=`DAY ${i.day} · YEAR OF 24`;
 document.getElementById('tbPct').textContent=weekPct(i.week)+'%';
 const tg=currentTarget(),t=document.getElementById('tgt');
 if(tg){t.textContent=tg;t.className='v';}else{t.textContent='Set it in the Sunday review →';t.className='v empty';}
 document.getElementById('todayLabel').textContent=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'][new Date().getDay()];
 document.getElementById('coreList').innerHTML=coreItems().map(it=>`
  <div class="task ${d.core[it.k]?'done':''}">
   <div class="ck ${d.core[it.k]?'on':''}" onclick="toggleCore('${it.k}')"></div>
   <div class="tl" onclick="toggleCore('${it.k}')">${it.n}${it.s?`<small>${esc(it.s)}</small>`:''}</div>
   ${it.go?`<button class="go" onclick="event.stopPropagation();go('${it.go}')">OPEN</button>`:''}</div>`).join('');
 const ex=document.getElementById('extraList');
 ex.innerHTML=d.extras.length?d.extras.map(e=>`<div class="task ${e.done?'done':''}">
   <div class="ck ${e.done?'on':''}" onclick="toggleExtra('${e.id}')"></div>
   <div class="tl" onclick="toggleExtra('${e.id}')">${esc(e.text)}</div>
   <button class="xbtn" onclick="delExtra('${e.id}')">×</button></div>`).join(''):'<div class="empty" style="padding:12px;">Nothing extra today.</div>';
 document.getElementById('dayNotes').value=d.notes||'';
}
function toggleCore(k){const d=day();d.core[k]=!d.core[k];
 if(k==='god'){week(info().week).god[new Date().getDay()]=d.core[k];}
 save();renderToday();}
function addExtra(){const el=document.getElementById('newTask'),v=el.value.trim();if(!v)return;day().extras.push({id:uid(),text:v,done:false});el.value='';save();renderToday();}
function toggleExtra(id){const e=day().extras.find(x=>x.id===id);e.done=!e.done;save();renderToday();}
function delExtra(id){const d=day();d.extras=d.extras.filter(x=>x.id!==id);save();renderToday();}
let noteTimer;
function saveNotes(){day().notes=document.getElementById('dayNotes').value;clearTimeout(noteTimer);
 noteTimer=setTimeout(()=>{save();const n=document.getElementById('notesSaved');n.textContent='Saved.';setTimeout(()=>n.textContent='Saved automatically to this date.',1400);},450);}
function openPastNotes(){
 const ks=Object.keys(S.days).filter(k=>S.days[k].notes&&S.days[k].notes.trim()).sort().reverse();
 openModal(`<div class="mhead"><h3>Past Notes</h3><button class="xbtn" onclick="closeModal()">×</button></div>
 ${ks.length?ks.map(k=>`<div style="border-bottom:1px solid var(--line);padding:11px 0;" onclick="viewNote('${k}')">
  <div class="row"><span class="bsm" style="color:var(--gold-dim);">${parseD(k).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</span><span class="bsm">›</span></div>
  <div style="font-size:14px;color:var(--ink-dim);line-height:1.5;margin-top:4px;white-space:pre-wrap;">${esc(S.days[k].notes.slice(0,180))}${S.days[k].notes.length>180?'…':''}</div></div>`).join(''):'<div class="empty">No notes yet.</div>'}`);}
function viewNote(k){const d=S.days[k];if(!d)return;
 detailModal(parseD(k).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}),k,[['Notes',d.notes]],`delNote('${k}')`);}
function delNote(k){if(!askDelete('Delete this day\u2019s notes?'))return;S.days[k].notes='';save();closeModal();renderToday();}

/* =================== EVENTS =================== */
function renderEvents(){
 document.getElementById('evSeg').innerHTML=[['events','Events'],['pipeline','Pipeline'],['money','Money']]
  .map(([k,l])=>`<button class="${evTab===k?'on':''}" onclick="evTab='${k}';evOpen=null;pipeOpen=null;renderEvents()">${l}</button>`).join('');
 const b=document.getElementById('evBody');
 if(evOpen){b.innerHTML=eventDetail();return;}
 if(pipeOpen){b.innerHTML=pipeDetail();return;}
 b.innerHTML=evTab==='events'?evList():evTab==='pipeline'?pipeList():moneyView();

function nextEvTask(e){
 if(e.type==='Mamba Day')return e.debriefNotes?'LOGGED':(e.objective?'READY':'SET OBJECTIVE');
 const f=EV_CHECK.find(([k])=>!e.check||!e.check[k]);
 return f?f[1].toUpperCase():'COMPLETE';
}
function evList(){
 const today=iso();
 const up=S.events.filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date));
 const pa=S.events.filter(e=>e.date<today).sort((a,b)=>b.date.localeCompare(a.date));
 const nextC=up.find(e=>e.type==='CAIRO');
 const row=e=>{const d=parseD(e.date),nt=nextEvTask(e),done=nt==='COMPLETE'||nt==='LOGGED';
  return `<div class="lr" onclick="evOpen='${e.id}';renderEvents()">
   <div class="lr-date"><div class="d" style="color:${TYPE_C[e.type]||'var(--gold)'}">${d.getDate()}</div><div class="m">${MON[d.getMonth()]}</div></div>
   <div class="lr-mid"><b>${esc(e.name)}</b><span>${esc(e.venue||e.type)}${evRevenue(e)?' · '+money(evRevenue(e)):''}</span></div>
   <div class="lr-next ${done?'done':''}">${nt}</div></div>`;};
 return `
 <div class="cairo">
   <div class="nm">CAIRO</div>
   <div class="fm">${S.cairoFormat?esc(S.cairoFormat):'Format not defined yet — this is the blocker.'}</div>
   ${nextC?`<div class="row" style="margin-top:14px;padding-top:13px;border-top:1px solid var(--purple2);">
     <div><div class="bsm" style="color:var(--gold);">NEXT EDITION</div><div style="font-size:16px;margin-top:2px;">${esc(nextC.name)}</div></div>
     <div style="text-align:right;"><div style="font-family:'Oswald';font-size:26px;color:var(--gold);line-height:1;">${Math.max(0,Math.round((parseD(nextC.date)-parseD(iso()))/864e5))}</div><div class="bsm">DAYS</div></div></div>`:''}
   <button class="bg" style="margin-top:13px;" onclick="editFormat()">${S.cairoFormat?'Edit Format':'Define The Format'}</button>
 </div>
 <div class="brow" style="margin-bottom:13px;">
   <button class="bp" onclick="openEvent()">+ Event</button>
   <button class="bpp" onclick="openEvent(null,'Mamba Day')">+ Mamba Day</button>
 </div>
 <div class="card"><div class="ct">Upcoming</div>${up.length?up.map(row).join(''):'<div class="empty">Nothing booked yet.</div>'}</div>
 <div class="card"><div class="ct" style="color:var(--ink-faint);">Past</div>${pa.length?pa.map(row).join(''):'<div class="empty">No past events.</div>'}</div>`;

 openModal(`<div class="mhead"><h3>${id?'Edit':(isM?'New Mamba Day':'New Event')}</h3><button class="xbtn" onclick="closeModal()">×</button></div>

 ${isM?'':`

function pipeList(){

 const val=open.reduce((s,p)=>s+(+p.value||0),0);
 const stale=S.pipeline.filter(p=>p.nextDate&&p.nextDate<iso()&&!['Delivered','Renewed','Lost'].includes(p.stage));
 return `
 <div class="sg" style="margin-bottom:13px;">
  <div class="st"><div class="n">${open.length}</div><div class="l">Open Deals</div></div>
  <div class="st"><div class="n sm">${money(val)}</div><div class="l">Pipeline Value</div></div>
 </div>
 ${stale.length?`<div class="flag">${stale.length} deal${stale.length>1?'s are':' is'} past its next-step date. ${esc(stale[0].brand)}${stale.length>1?' and others':''} — nothing moves on its own.</div>`:''}
 <button class="bp" style="margin-bottom:13px;" onclick="openPipe()">+ Add Deal</button>
 ${STAGES.map(st=>byStage[st].length?`<div class="card">
   <div class="ct" style="color:${STAGE_C[st]}">${st} · ${byStage[st].length}</div>
   ${byStage[st].map(p=>`<div class="lr" onclick="pipeOpen='${p.id}';renderEvents()">
     <div class="lr-mid"><b>${esc(p.brand)}</b><span>${p.value?money(p.value):'No value set'}${p.nextStep?' · '+esc(p.nextStep):''}</span></div>
     <div class="lr-next ${p.nextDate&&p.nextDate<iso()?'':'done'}" style="${p.nextDate&&p.nextDate<iso()?'color:var(--red)':''}">${p.nextDate?p.nextDate.slice(5):'NO NEXT STEP'}</div></div>`).join('')}

 ${S.pipeline.length?'':'<div class="empty">Start with the four you named: Sal TT, Otishi, Sora, the creator platform.</div>'}`;
}

function moneyView(){

 const collected=evs.reduce((s,e)=>s+evCollected(e),0);

 const att=totalAttendees();
 const done=evs.filter(e=>e.actualAttend);
 return `

  <div class="st"><div class="n sm" style="color:${booked-cost>=0?'var(--green)':'var(--red)'}">${money(booked-cost)}</div><div class="l">Margin</div></div>
 </div>

   <div class="st"><div class="n sm">${money(Math.round(cost/att))}</div><div class="l">Cost / Head</div></div></div>`:'<div class="sub">Log actual attendance on an event and this fills in.</div>'}
 </div>
 <div class="card"><div class="ct">By Event</div>
  ${evs.length?evs.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>{const r=evRevenue(e),p=evProfit(e);
   return `<div class="lr" onclick="evTab='events';evOpen='${e.id}';renderEvents()">
    <div class="lr-mid"><b>${esc(e.name)}</b><span>${e.date} · ${e.actualAttend?e.actualAttend+' people':'not run yet'}</span></div>
    <div style="text-align:right;"><div style="font-family:'Oswald';font-size:16px;color:${p>=0?'var(--green)':'var(--red)'}">${money(p)}</div>
    <div class="bsm">${money(r)} in</div></div></div>`;}).join(''):'<div class="empty">No events yet.</div>'}
 </div>
 ${done.length>=2?`<div class="card"><div class="ct">Attendance Accuracy</div>
  ${done.map(e=>{const pct=e.projAttend?Math.round(e.actualAttend/e.projAttend*100):null;
   return `<div class="met"><div class="met-t"><div class="met-n">${esc(e.name)}</div><div class="met-v"><b>${e.actualAttend}</b> / ${e.projAttend||'?'}</div></div>
   <div class="trk"><div class="fil ${pct>=100?'g':''}" style="width:${Math.min(100,pct||0)}%"></div></div></div>`;}).join('')}
  <div class="note">Getting this right is the skill. Everything else is downstream of knowing who will actually show up.</div></div>`:''}`;
}

function renderBuild(){
 document.getElementById('buildSeg').innerHTML=[['prep','Prep'],['reps','Reps'],['teardown','Teardowns'],['summary','Summary']]
  .map(([k,l])=>`<button class="${buildTab===k?'on':''}" onclick="buildTab='${k}';renderBuild()">${l}</button>`).join('');
 const b=document.getElementById('buildBody');
 b.innerHTML=buildTab==='prep'?bPrep():buildTab==='reps'?bReps():buildTab==='teardown'?bTeardown():bSummary();
}
function bPrep(){
 const s=S.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
 const bar=k=>{const done=prepState[k].filter(Boolean).length,tot=S.prep[k].length;
  return `<div class="met" style="margin-bottom:9px;"><div class="met-t"><div class="met-n" style="color:var(--purple-lt);">${k==='production'?'PRODUCTION':'GEAR'}</div><div class="met-v"><b>${done}</b> / ${tot}</div></div><div class="trk"><div class="fil" style="width:${tot?done/tot*100:0}%"></div></div></div>`;};
 const list=k=>S.prep[k].map((x,i)=>`<div class="task ${prepState[k][i]?'done':''}">
   <div class="ck ${prepState[k][i]?'on':''}" onclick="togglePrep('${k}',${i})"></div>
   <div class="tl" onclick="togglePrep('${k}',${i})" style="font-size:15px;">${esc(x)}</div>
   <button class="xbtn" onclick="event.stopPropagation();delPrep('${k}',${i})">×</button></div>`).join('');
 return `
 <div class="card">
  <div class="row" style="margin-bottom:10px;"><div class="ct" style="margin:0;">Event Prep Checklists</div><button class="bsm" onclick="resetPrep()">RESET</button></div>
  <div class="sub" style="margin-bottom:14px;">Luxury is a reliability business. This is the list that keeps a shuttle from being late.</div>
  ${bar('production')}${list('production')}
  <div class="f2" style="margin-top:9px;"><div><input id="np_production" placeholder="Add production step"></div><div style="flex:0 0 64px;"><button class="bg" style="padding:11px 0;" onclick="addPrep('production')">Add</button></div></div>
  <div style="height:20px;"></div>
  ${bar('gear')}${list('gear')}
  <div class="f2" style="margin-top:9px;"><div><input id="np_gear" placeholder="Add gear item"></div><div style="flex:0 0 64px;"><button class="bg" style="padding:11px 0;" onclick="addPrep('gear')">Add</button></div></div>
  <div class="note">Checks clear when you start a block. The list stays.</div>
 </div>
 <div class="card"><div class="ct">Build Block</div>
  <div class="f"><label>Objective — what does done look like</label><textarea id="sb_o" placeholder="Sponsor deck to 8 slides. Not designing, not researching."></textarea></div>
  <div class="f"><label>Reference / who you're studying</label><input id="sb_r" placeholder="Daybreaker deck"></div>
  <button class="bpp" onclick="startSession()">Start Block</button>
 </div>
 ${s&&!s.worked?`<div class="card"><div class="ct">Debrief</div>
  <div style="font-size:15.5px;line-height:1.4;">${esc(s.objective)}</div>
  ${s.reference?`<div class="sub" style="margin-top:3px;">Reference: ${esc(s.reference)}</div>`:''}<div class="hr"></div>
  <div class="f"><label>What worked</label><textarea id="sd_w"></textarea></div>
  <div class="f"><label>What didn't</label><textarea id="sd_d"></textarea></div>
  <div class="f"><label>Hours</label><input type="number" step="0.5" id="sd_h"></div>
  <button class="bp" onclick="endSession('${s.id}')">Log Debrief</button></div>`:''}
 ${S.sessions.filter(x=>x.worked).length?`<div class="card"><div class="ct">Past Blocks</div>
  ${S.sessions.filter(x=>x.worked).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12).map(x=>`
   <div style="border-bottom:1px solid var(--line);padding:11px 0;" onclick="viewSession('${x.id}')">
    <div class="row"><span class="bsm" style="color:var(--gold-dim);">${x.date} ›</span>${x.hours?`<span class="bsm">${x.hours} HRS</span>`:''}</div>
    <div style="font-size:15px;margin-top:3px;">${esc(x.objective)}</div>
    ${x.reference?`<div class="ent-m">Reference: ${esc(x.reference)}</div>`:''}
    <div class="ent-b">✓ ${esc(x.worked)}</div>${x.didnt?`<div class="ent-b" style="color:var(--ink-faint);">✗ ${esc(x.didnt)}</div>`:''}</div>`).join('')}</div>`:''}`;
}
function togglePrep(k,i){prepState[k][i]=!prepState[k][i];renderBuild();}
function resetPrep(){prepState={production:[],gear:[]};renderBuild();}
function addPrep(k){const el=document.getElementById('np_'+k),v=el.value.trim();if(!v)return;S.prep[k].push(v);save();renderBuild();}
function delPrep(k,i){S.prep[k].splice(i,1);prepState[k].splice(i,1);save();renderBuild();}
function startSession(){const o=document.getElementById('sb_o').value.trim();if(!o)return;
 S.sessions.push({id:uid(),date:iso(),objective:o,reference:document.getElementById('sb_r').value,worked:'',didnt:''});
 prepState={production:[],gear:[]};save();renderBuild();}
function endSession(id){const s=S.sessions.find(x=>x.id===id);
 s.worked=document.getElementById('sd_w').value.trim()||'—';s.didnt=document.getElementById('sd_d').value;
 const h=parseFloat(document.getElementById('sd_h').value);if(h){s.hours=h;const w=week(info().week);w.hours=(w.hours||0)+h;}
 save();renderBuild();renderToday();}
function viewSession(id){const x=S.sessions.find(y=>y.id===id);if(!x)return;
 detailModal(x.objective,x.date+(x.hours?' · '+x.hours+' hrs':''),[['Reference',x.reference],['What worked',x.worked],["What didn't",x.didnt]],`delSession('${id}')`);}
function delSession(id){if(!askDelete('Delete this block?'))return;S.sessions=S.sessions.filter(x=>x.id!==id);save();closeModal();renderBuild();}

function bReps(){
 const i=info(),target=currentTarget(),m=metrics(i.week);
 const drills=S.weekDrills['w'+i.week]||[];
 return `
 <div class="target"><div class="l">ATTACKING THIS WEEK</div><div class="v ${target?'':'empty'}">${target?esc(target):'Set it in the Sunday review'}</div></div>
 <div class="card"><div class="row" style="margin-bottom:10px;"><div class="ct" style="margin:0;">Reps</div><div class="mono" style="font-size:13px;color:var(--gold);">${m.reps} / 3</div></div>
  <div class="trk"><div class="fil" style="width:${Math.min(100,m.reps/3*100)}%"></div></div></div>
 ${drills.length?`<div class="card"><div class="ct p">Drills Queued</div>
  ${drills.map((d,ix)=>`<div class="task"><div class="tl" style="font-size:14.5px;">${esc(d)}</div><button class="xbtn" onclick="unqueue(${ix})">×</button></div>`).join('')}
  <div class="note">From the library. Log one below when it's done.</div></div>`:''}
 <div class="card"><div class="ct">Log a Rep</div>
  <div class="f"><label>Skill attacked</label><select id="rp_s">${SKILLS.map(w=>`<option ${target===w?'selected':''}>${w}</option>`).join('')}</select></div>
  <div class="f"><label>What you did</label><input id="rp_d" placeholder="Recorded the 60-second CAIRO pitch five times"></div>
  <div class="f"><label>What you learned</label><textarea id="rp_n"></textarea></div>
  <button class="bp" onclick="logRep()">Log Rep</button></div>
 <div class="card"><div class="ct">History</div>
  ${S.reps.length?S.reps.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`
   <div style="border-bottom:1px solid var(--line);padding:10px 0;" onclick="viewRep('${r.id}')">
    <div class="row"><span class="pill" style="color:var(--purple-lt);">${esc(r.skill)}</span><span class="bsm">${r.date.slice(5)} ›</span></div>
    <div style="font-size:14.5px;margin-top:6px;">${esc(r.drill)}</div>${r.notes?`<div class="ent-b">${esc(r.notes)}</div>`:''}</div>`).join(''):'<div class="empty">No reps logged yet.</div>'}
 </div>`;
}
function logRep(){const d=document.getElementById('rp_d').value.trim();if(!d)return;
 S.reps.push({id:uid(),date:iso(),skill:document.getElementById('rp_s').value,drill:d,notes:document.getElementById('rp_n').value});
 save();renderBuild();renderToday();}
function viewRep(id){const r=S.reps.find(x=>x.id===id);if(!r)return;
 detailModal(r.drill,r.date+' · '+r.skill,[['Skill',r.skill],['What you did',r.drill],['What you learned',r.notes]],`delRep('${id}')`);}
function delRep(id){if(!askDelete('Delete this rep?'))return;S.reps=S.reps.filter(x=>x.id!==id);save();closeModal();renderBuild();renderToday();}
function unqueue(ix){const k='w'+info().week;S.weekDrills[k].splice(ix,1);save();renderBuild();}

function bTeardown(){
 return `
 <div class="card"><div class="ct">Teardowns</div>
  <div class="sub">Daybreaker. Hyrox. Tough Mudder. A Discovery Land activation. Take one apart a week and you stop guessing.</div></div>
 <div class="card">
  <div class="f2"><div class="f"><label>Brand / Event</label><input id="t_b"></div><div class="f"><label>Where</label><input id="t_w" placeholder="NYC"></div></div>
  <div class="f"><label>What is it, in one line</label><input id="t_1"></div>
  <div class="f"><label>Why does it work</label><textarea id="t_y"></textarea></div>
  <div class="f"><label>How do they make money</label><textarea id="t_m" placeholder="Ticket price, sponsors, tiers, what you can find."></textarea></div>
  <div class="f"><label>What would this cost to produce</label><textarea id="t_c"></textarea></div>
  <div class="f"><label>What's stealable for CAIRO</label><textarea id="t_s"></textarea></div>
  <button class="bp" onclick="logTeardown()">Save Teardown</button>
 </div>
 <div class="card"><div class="ct">Library</div>
  ${S.teardowns.length?S.teardowns.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`
   <div class="ent" style="--sc:var(--purple2);" onclick="viewTeardown('${t.id}')">
    <div class="ent-top"><div class="ent-t">${esc(t.brand)}</div><div class="pill" style="color:var(--ink-faint);">${t.date.slice(5)}</div></div>
    ${t.one?`<div class="ent-m">${esc(t.one)}</div>`:''}
    ${t.steal?`<div class="ent-b"><i>Stealable:</i> ${esc(t.steal)}</div>`:''}</div>`).join(''):'<div class="empty">Nothing torn apart yet.</div>'}
 </div>`;
}
function logTeardown(){const b=document.getElementById('t_b').value.trim();if(!b)return;
 S.teardowns.push({id:uid(),date:iso(),brand:b,where:document.getElementById('t_w').value,one:document.getElementById('t_1').value,
  why:document.getElementById('t_y').value,money:document.getElementById('t_m').value,cost:document.getElementById('t_c').value,steal:document.getElementById('t_s').value});
 save();renderBuild();renderToday();}
function viewTeardown(id){const t=S.teardowns.find(x=>x.id===id);if(!t)return;
 detailModal(t.brand,(t.where||'')+' · '+t.date,[['What it is',t.one],['Why it works',t.why],['How they make money',t.money],['What it would cost',t.cost],['Stealable for CAIRO',t.steal]],`delTeardown('${id}')`);}
function delTeardown(id){if(!askDelete('Delete this teardown?'))return;S.teardowns=S.teardowns.filter(x=>x.id!==id);save();closeModal();renderBuild();renderToday();}

function bSummary(){
 const run=S.events.filter(e=>e.type!=='Mamba Day'&&Object.values(e.debrief||{}).filter(Boolean).length>=3);
 const avg=e=>{const r=Object.values(e.debrief).filter(Boolean);return r.reduce((a,b)=>a+b,0)/r.length;};
 const best=run.filter(e=>avg(e)>=7.5);
 const dim={};DEBRIEF.forEach(([k,l])=>{const vals=run.map(e=>e.debrief[k]).filter(Boolean);
  if(vals.length)dim[l]=(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);});
 const sorted=Object.entries(dim).sort((a,b)=>a[1]-b[1]);
 const att=S.events.filter(e=>e.actualAttend&&e.projAttend);
 const acc=att.length?Math.round(att.reduce((s,e)=>s+e.actualAttend/e.projAttend,0)/att.length*100):null;
 return `
 <div class="card"><div class="ct">What Your Best Events Share</div>
  ${best.length>=2?`<div style="font-size:15.5px;line-height:1.6;">${best.length} events scored 7.5+.</div>
   <div class="tags" style="margin-top:11px;">${best.map(e=>`<span class="tag g">${esc(e.name)}</span>`).join('')}</div>
   <div class="note">Look at what they have in common — venue, day, price, sponsor count, format. That's the repeatable part.</div>`
   :`<div class="sub">Debrief at least two events and this starts working. ${run.length} scored so far.</div>`}</div>
 ${sorted.length?`<div class="card"><div class="ct">Scored Across Every Event</div>
  ${sorted.map(([l,v])=>`<div class="met"><div class="met-t"><div class="met-n">${l}</div><div class="met-v"><b>${v}</b> / 10</div></div>
  <div class="trk"><div class="fil ${v>=7.5?'g':''}" style="width:${v*10}%"></div></div></div>`).join('')}
  <div class="flag gold" style="margin-top:14px;">Weakest dimension: <b>${sorted[0][0]}</b> at ${sorted[0][1]}. That's next week's target.</div></div>`:''}
 ${acc?`<div class="card"><div class="ct">Demand Accuracy</div>
  <div class="big"><div class="n">${acc}%</div><div class="l">OF PROJECTED TURNOUT, AVERAGE</div></div>
  <div class="note">${acc>=95?'You can predict a room. That is the skill nobody in luxury has.':acc>=70?'Closing the gap. Keep projecting before every event.':'You are over-projecting. Either the promotion is short or the projection is hope.'}</div></div>`:''}
 <div class="card"><div class="ct">The Database</div>
  <div class="sg"><div class="st"><div class="n">${totalAttendees()}</div><div class="l">People Through The Door</div></div>
  <div class="st"><div class="n">${totalCaptured()}</div><div class="l">Data Captured</div></div></div>
  <div class="note">This is the asset. An agency owns nothing; you own this.</div></div>`;
}

/* =================== REVIEW =================== */
function renderReview(){
 document.getElementById('revSeg').innerHTML=[['weekly','Weekly'],['quarterly','Quarterly'],['past','Past']]
  .map(([k,l])=>`<button class="${revTab===k?'on':''}" onclick="revTab='${k}';renderReview()">${l}</button>`).join('');
 document.getElementById('revBody').innerHTML=revTab==='weekly'?revWeekly():revTab==='quarterly'?revQuarterly():revPast();
}
function repeatFlag(){const i=info(),ws=[];
 for(let n=i.week-1;n>=Math.max(1,i.week-3);n--){const r=S.reviews['w'+n];if(r&&r.weakness)ws.push(r.weakness);}
 return(ws.length>=3&&ws[0]===ws[1]&&ws[1]===ws[2])?ws[0]:null;}
function revWeekly(){
 const i=info(),k='w'+i.week,r=S.reviews[k]||{},m=metrics(i.week),prev=prevReview(),rep=repeatFlag(),qi=quarterIntention();
 return `
 <div class="target" onclick="revTab='quarterly';renderReview()">
  <div class="l">${qi.label} — QUARTERLY INTENTION</div><div class="v ${qi.set?'':'empty'}">${esc(qi.text)}</div></div>
 <div class="card"><div class="ct">Week ${i.week} — The Numbers</div>
  ${Object.keys(TARGETS).map(x=>{const c=TARGETS[x],v=m[x]||0;
   return `<div class="met"><div class="met-t"><div class="met-n">${c.l}</div><div class="met-v"><b>${v}</b> / ${c.t}</div></div>
   <div class="trk"><div class="fil" style="width:${Math.min(100,v/c.t*100)}%"></div></div>
   ${c.man?`<div class="stp"><button onclick="stepM('${x}',-${c.s||1})">–</button><input type="number" value="${v}" onchange="setM('${x}',this.value)"><button onclick="stepM('${x}',${c.s||1})">+</button></div>`:''}</div>`}).join('')}
  <div class="hr"></div>
  <div class="bsm" style="color:var(--gold);margin-bottom:8px;">GOD TIME — CHECKS ITSELF FROM TODAY</div>
  <div class="wk">${['S','M','T','W','T','F','S'].map((d,ix)=>`<div class="${week(i.week).god[ix]?'on':''}" onclick="godDay(${ix})">${d}</div>`).join('')}</div>
 </div>
 ${rep?`<div class="flag">You've named <b>${esc(rep)}</b> three weeks running. Either the drills aren't working or you're not doing them. Change the approach, not the target.</div>`:''}
 ${prev&&prev.avoiding?`<div class="carry">Last review you said you were avoiding: "${esc(prev.avoiding)}" — did you do it?</div>`:''}
 <div class="card"><div class="ct">Six Questions</div>
  <div class="q"><label>What did I build this week?</label><textarea id="r_create">${esc(r.create||'')}</textarea></div>
  <div class="q"><label>What did I learn?</label><textarea id="r_learn">${esc(r.learn||'')}</textarea></div>
  <div class="q"><label>Where did I fail?</label><textarea id="r_fail">${esc(r.fail||'')}</textarea></div>
  <div class="q"><label>Did this week serve God and my family, or compete with them?</label><textarea id="r_family">${esc(r.family||'')}</textarea>
   <label style="margin-top:9px;color:var(--purple-lt);">Where can I improve this week?</label><textarea id="r_improve">${esc(r.improve||'')}</textarea></div>
  <div class="q"><label>What skill am I attacking this coming week?</label>
   <select id="r_weak"><option value="">— pick one —</option>${SKILLS.map(w=>`<option ${r.weakness===w?'selected':''}>${w}</option>`).join('')}</select></div>
  <div class="q"><label>What am I avoiding?</label><textarea id="r_avoid" placeholder="The call you haven't made. The price you won't say out loud.">${esc(r.avoiding||'')}</textarea></div>
  <button class="bp" onclick="saveWeekly()">Save Review</button>
  <div class="note">The skill you pick becomes your attack target the moment you save.</div></div>`;
}
function stepM(k,d){const w=week(info().week);w[k]=Math.max(0,Math.round(((w[k]||0)+d)*10)/10);save();renderReview();renderToday();}
function setM(k,v){const w=week(info().week);w[k]=Math.max(0,parseFloat(v)||0);save();renderReview();renderToday();}
function godDay(ix){const w=week(info().week);w.god[ix]=!w.god[ix];save();renderReview();}
function saveWeekly(){const i=info();
 S.reviews['w'+i.week]={create:document.getElementById('r_create').value,learn:document.getElementById('r_learn').value,
  fail:document.getElementById('r_fail').value,family:document.getElementById('r_family').value,
  improve:document.getElementById('r_improve').value,weakness:document.getElementById('r_weak').value,
  avoiding:document.getElementById('r_avoid').value,date:iso()};
 save();renderToday();go('today');}
function revQuarterly(){
 const q=quarterInfo(),r=S.quarters[q.key]||{};
 const evs=S.events.filter(e=>e.type!=='Mamba Day');
 const rev=evs.reduce((s,e)=>s+evRevenue(e),0);
 return `
 <div class="target"><div class="l">${q.l}</div><div class="v">${r.intention?esc(r.intention):q.th}</div></div>
 <div class="card"><div class="ct">Where You Are</div>
  <div class="sg">
   <div class="st"><div class="n">${evs.filter(e=>e.actualAttend).length}</div><div class="l">Events Run</div></div>
   <div class="st"><div class="n sm">${money(rev)}</div><div class="l">Booked</div></div>
   <div class="st"><div class="n">${totalAttendees()}</div><div class="l">Attendees</div></div>
   <div class="st"><div class="n">${S.crm.length}</div><div class="l">Relationships</div></div>
   <div class="st"><div class="n">${S.pipeline.filter(p=>['Deposit Paid','Delivered','Renewed'].includes(p.stage)).length}</div><div class="l">Deals Closed</div></div>
   <div class="st"><div class="n">${S.failures.length}<small>/200</small></div><div class="l">Failures</div></div></div>
 </div>
 <div class="card"><div class="ct">The Look-Back</div>
  <div class="sub">Pull the photos and the debrief from your first event this quarter and your latest one. Put them side by side. Five minutes, and it's the most honest measure you have.</div>
  <div class="q" style="margin-top:13px;"><label>Can you see the difference? Where exactly?</label><textarea id="q_listen">${esc(r.listen||'')}</textarea></div></div>
 <div class="card"><div class="ct">Eight Questions</div>
  <div class="q"><label>Am I measurably better than 90 days ago? Name the capability.</label><textarea id="q_better">${esc(r.better||'')}</textarea></div>
  <div class="q"><label>Is CAIRO becoming a brand people recognize, or still just events I throw?</label><textarea id="q_sound">${esc(r.sound||'')}</textarea></div>
  <div class="q"><label>Which relationships actually got real? Who moved from a name to a call?</label><textarea id="q_rel">${esc(r.rel||'')}</textarea></div>
  <div class="q"><label>Is any single client creeping past 40% of revenue?</label><textarea id="q_habit">${esc(r.habit||'')}</textarea></div>
  <div class="q"><label>Am I building an asset, or have I quietly become a vendor?</label><textarea id="q_biz">${esc(r.biz||'')}</textarea></div>
  <div class="q"><label>What did this quarter cost my marriage and my health?</label><textarea id="q_cost">${esc(r.cost||'')}</textarea></div>
  <div class="q"><label>One wish for next quarter — and why isn't that the plan?</label><textarea id="q_wish">${esc(r.wish||'')}</textarea></div>
  <div class="q"><label>Intention for next quarter (pins to the top all quarter)</label><input id="q_int" value="${esc(r.intention||'')}"></div>
  <button class="bp" onclick="saveQuarter('${q.key}')">Save Quarterly Review</button></div>`;
}
function saveQuarter(k){S.quarters[k]={};
 ['listen','better','sound','rel','habit','biz','cost','wish'].forEach(f=>S.quarters[k][f]=document.getElementById('q_'+f).value);
 S.quarters[k].intention=document.getElementById('q_int').value;S.quarters[k].date=iso();save();renderReview();}
function revPast(){
 const ks=Object.keys(S.reviews).map(k=>({n:+k.slice(1),...S.reviews[k]})).sort((a,b)=>b.n-a.n);
 return `<div class="card"><div class="ct">Weekly Reviews</div>
 ${ks.length?ks.map(r=>`<div class="lr" onclick="viewReview(${r.n})">
  <div class="lr-date"><div class="d">${r.n}</div><div class="m">WEEK</div></div>
  <div class="lr-mid"><b>${r.weakness?esc(r.weakness):'No target set'}</b><span>${r.date||''}</span></div>
  <div class="lr-next">OPEN ›</div></div>`).join(''):'<div class="empty">No reviews yet.</div>'}</div>
 <div class="card"><div class="ct">Quarterly Reviews</div>
 ${Object.keys(S.quarters).length?Object.entries(S.quarters).map(([k,q])=>`<div class="lr" onclick="viewQuarter('${k}')">
  <div class="lr-mid"><b>${k.replace('q_','').replace('_',' · ')}</b><span>${q.intention?esc(q.intention):(q.date||'')}</span></div>
  <div class="lr-next">OPEN ›</div></div>`).join(''):'<div class="empty">No quarterly reviews yet.</div>'}</div>`;
}
function viewReview(n){const r=S.reviews['w'+n];if(!r)return;
 detailModal('Week '+n,r.date||'',[['What I built',r.create],['What I learned',r.learn],['Where I failed',r.fail],['God and family',r.family],['Where I can improve',r.improve],['Skill attacked',r.weakness],['What I was avoiding',r.avoiding]],`delReview(${n})`);}
function delReview(n){if(!askDelete('Delete week '+n+' review?'))return;delete S.reviews['w'+n];save();closeModal();renderReview();renderToday();}
function viewQuarter(k){const q=S.quarters[k];if(!q)return;
 detailModal(k.replace('q_','').replace('_',' · '),q.date||'',[['Intention',q.intention],['The look-back',q.listen],['Measurably better',q.better],['CAIRO as a brand',q.sound],['Relationships',q.rel],['Client concentration',q.habit],['Asset or vendor',q.biz],['What it cost',q.cost],['One wish',q.wish]],`delQuarter('${k}')`);}
function delQuarter(k){if(!askDelete('Delete this quarterly review?'))return;delete S.quarters[k];save();closeModal();renderReview();}

/* =================== OTHER =================== */
function renderOther(){
 document.getElementById('otherMain').style.display=otherOpen?'none':'block';
 document.getElementById('otherDetail').style.display=otherOpen?'block':'none';
 if(otherOpen){renderOtherDetail();return;}
 const md=S.events.filter(e=>e.type==='Mamba Day'&&e.date>=iso()).sort((a,b)=>a.date.localeCompare(b.date))[0];
 const el=document.getElementById('mambaCountdown');
 if(md){const days=Math.round((parseD(md.date)-parseD(iso()))/864e5);
  el.innerHTML=`<div class="big"><div class="n">${days===0?'TODAY':days}</div><div class="l">${days===0?'GO DEEP':'DAYS OUT · '+parseD(md.date).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</div></div>
  ${md.objective?`<div style="text-align:center;font-size:18px;line-height:1.4;padding:14px 6px 4px;border-top:1px solid var(--line);margin-top:14px;">${esc(md.objective)}</div>`:'<div class="note" style="text-align:center;">No objective set yet — you pick it.</div>'}
  <button class="bg" style="margin-top:12px;" onclick="evTab='events';evOpen='${md.id}';go('events',true)">Open It</button>`;
 }else{el.innerHTML=`<div class="sub">No Mamba Day scheduled. One a month — 8 to 12 hours on the business, protected before life fills the space.</div>
  <button class="bpp" style="margin-top:12px;" onclick="go('events');setTimeout(()=>openEvent(null,'Mamba Day'),250)">Schedule One</button>`;}
 const bc=Object.values(S.books).filter(b=>b&&b.done).length;
 const stale=S.crm.filter(c=>!c.lastTouch||(parseD(iso())-parseD(c.lastTouch))/864e5>90).length;
 const items=[
  ['lib','Rep Library','Drills sorted by skill',1],
  ['books','Reading',bc+' / 24 books',1],
  ['crm','Relationships',S.crm.length+' people'+(stale?' · '+stale+' going cold':''),0],
  ['fail','Failure Scoreboard',S.failures.length+' / 200 this year',0],
  ['year','Year Progress','The whole arc, one screen',0],
  ['settings','Settings & Backup','Protect the year',0]
 ];
 document.getElementById('otherMenu').innerHTML=`<div class="card menu">${items.map(([k,t,sub,isAcc])=>`
  <button onclick="${isAcc?`toggleAcc('${k}')`:`openOther('${k}')`}"><div class="mi"><b>${t}</b><span>${esc(sub)}</span></div>
  <div class="ar">${isAcc&&accOpen===k?'⌄':'›'}</div></button>
  ${isAcc&&accOpen===k?`<div style="padding:4px 0 14px;">${k==='lib'?libHTML():booksHTML()}</div>`:''}`).join('')}</div>`;
}
function toggleAcc(k){accOpen=accOpen===k?null:k;if(k==='lib')pendingDrills=[];renderOther();}
function openOther(k){otherOpen=k;renderOther();}
function libHTML(){
 const t=currentTarget(),cats=Object.keys(REP_LIB).sort((a,b)=>(b===t)-(a===t));
 return `<div class="acc"><div class="sub" style="margin-bottom:11px;">Sunday names the skill. Monday you shouldn't be inventing a drill — tap what you want, then save.</div>
 ${cats.map(cat=>`<div style="margin-bottom:14px;"><div class="ct" style="color:${t===cat?'var(--gold)':'var(--purple-lt)'};margin-bottom:6px;">${cat}${t===cat?' — THIS WEEK':''}</div>
  ${REP_LIB[cat].map(d=>{const on=pendingDrills.includes(d);
   return `<div class="task ${on?'done':''}" onclick="pickDrill(${JSON.stringify(d).replace(/"/g,'&quot;')})"><div class="ck ${on?'on':''}"></div><div class="tl" style="font-size:14.5px;">${esc(d)}</div></div>`;}).join('')}</div>`).join('')}
 <button class="bp" onclick="saveDrills()">Save ${pendingDrills.length?pendingDrills.length+' Drill'+(pendingDrills.length>1?'s':''):'Drills'} to This Week</button></div>`;
}
function pickDrill(d){const i=pendingDrills.indexOf(d);i>-1?pendingDrills.splice(i,1):pendingDrills.push(d);renderOther();}
function saveDrills(){if(!pendingDrills.length)return;const k='w'+info().week;S.weekDrills[k]=S.weekDrills[k]||[];
 pendingDrills.forEach(d=>{if(!S.weekDrills[k].includes(d))S.weekDrills[k].push(d);});
 pendingDrills=[];accOpen=null;save();buildTab='reps';go('build');}
function booksHTML(){return `<div class="acc">${BOOKS.map((b,ix)=>{const st=S.books[ix]||{};
 return `<div class="bk"><div class="bkc ${st.done?'on':''}" onclick="event.stopPropagation();toggleBook(${ix})"></div>
 <div class="bki" onclick="openBook(${ix})"><b>${esc(b.t)}</b><span>${esc(b.a)}</span></div><div class="bkm">${b.m}</div></div>`;}).join('')}
 <div class="note">Tap a title to log takeaways, action items, and quotes.</div></div>`;}
function toggleBook(ix){S.books[ix]=S.books[ix]||{};S.books[ix].done=!S.books[ix].done;save();renderOther();}
function openBook(ix){const b=BOOKS[ix],st=S.books[ix]||{};
 openModal(`<div class="mhead"><h3>${esc(b.t)}</h3><button class="xbtn" onclick="closeModal()">×</button></div>
 <div class="sub">${esc(b.a)} · ${b.m}</div>
 <div class="f" style="margin-top:14px;"><label>Takeaways</label><textarea id="b_tk" style="min-height:130px;">${esc(st.takeaways||'')}</textarea></div>
 <div class="f"><label>Action Items</label><textarea id="b_ac">${esc(st.actions||'')}</textarea></div>
 <div class="f"><label>Best Quotes</label><textarea id="b_q" style="min-height:100px;">${esc(st.quote||'')}</textarea></div>
 <button class="bp" onclick="saveBook(${ix})">Save</button>`);}
function saveBook(ix){S.books[ix]=Object.assign(S.books[ix]||{},{takeaways:document.getElementById('b_tk').value,
 actions:document.getElementById('b_ac').value,quote:document.getElementById('b_q').value});save();closeModal();renderOther();}

function renderOtherDetail(){
 const el=document.getElementById('otherDetail');
 const back=`<a class="back" onclick="otherOpen=null;renderOther()">‹ Other</a>`;
 if(otherOpen==='lib'||otherOpen==='books'){otherOpen=null;renderOther();return;}
 if(otherOpen==='crm'){
  const cold=c=>!c.lastTouch||(parseD(iso())-parseD(c.lastTouch))/864e5>90;
  const sorted=S.crm.slice().sort((a,b)=>(a.tier||'Z').localeCompare(b.tier||'Z')||(b.lastTouch||'').localeCompare(a.lastTouch||''));
  const stale=S.crm.filter(cold);
  el.innerHTML=back+`
  <div class="sg" style="margin-bottom:13px;">
   <div class="st"><div class="n">${S.crm.length}</div><div class="l">People</div></div>
   <div class="st"><div class="n" style="color:${stale.length?'var(--red)':'var(--green)'}">${stale.length}</div><div class="l">Going Cold</div></div></div>
  ${stale.length?`<div class="flag">${stale.length} ${stale.length===1?'person hasn\u2019t':'people haven\u2019t'} been touched in 90 days. The Cutalong list has an expiration date — that's the whole point of it.</div>`:''}
  <button class="bp" style="margin-bottom:13px;" onclick="openCRM()">+ Add Person</button>
  ${sorted.length?sorted.map(c=>`<div class="ent" style="--sc:${cold(c)?'var(--red)':'var(--green)'}" onclick="viewCRM('${c.id}')">
    <div class="ent-top"><div class="ent-t">${esc(c.name)}</div><div class="pill" style="color:${c.tier&&c.tier[0]==='A'?'var(--gold)':'var(--ink-faint)'}">${esc((c.tier||'—').split(' ')[0])}</div></div>
    <div class="ent-m">${esc(c.role==='Other'?(c.roleOther||'Other'):(c.role||''))}${c.org?' · '+esc(c.org):''}</div>
    <div class="ent-b" style="font-size:12.5px;">${c.lastTouch?'Last touched '+c.lastTouch:'Never touched'}${c.nextTouch?' · next '+c.nextTouch:''}</div>
    <div class="acts"><button class="bsm" onclick="event.stopPropagation();touchCRM('${c.id}')">TOUCHED TODAY</button>
    <button class="bsm" onclick="event.stopPropagation();openCRM('${c.id}')">EDIT</button></div></div>`).join('')
   :'<div class="empty">Start writing names down now. GMs, directors, marketing leads — the people who move between properties with budgets.</div>'}`;
 }
 if(otherOpen==='fail'){
  const y=S.failures.length;
  el.innerHTML=back+`
  <div class="card"><div class="big"><div class="n">${y}</div><div class="l">OF 200 THIS YEAR</div></div>
   <div class="trk" style="margin-top:14px;"><div class="fil" style="width:${Math.min(100,y/200*100)}%"></div></div>
   <div class="note" style="text-align:center;">${y} toward 30,000 in a lifetime. Every no moves it.</div></div>
  <div class="card"><div class="ct">Log a Failure</div>
   <div class="f"><label>Type</label><select id="fl_t"><option>Rejection</option><option>Ignored</option><option>Deal lost</option><option>Event underperformed</option><option>Pitch fell flat</option><option>Uncomfortable ask</option><option>Failed experiment</option></select></div>
   <div class="f"><label>What happened</label><input id="fl_n" placeholder="Emailed a GM I thought was out of reach. No reply."></div>
   <button class="bp" onclick="logFail()">Log It</button>
   <div class="note">This is the only number where up is good.</div></div>
  <div class="card"><div class="ct">The Reps</div>
   ${S.failures.length?S.failures.slice().reverse().map(f=>`<div style="border-bottom:1px solid var(--line);padding:9px 0;" onclick="viewFail('${f.id}')">
    <div class="row"><span class="pill" style="color:var(--red)">${esc(f.type)}</span><span class="bsm">${f.date.slice(5)} ›</span></div>
    ${f.note?`<div class="ent-b">${esc(f.note)}</div>`:''}</div>`).join(''):'<div class="empty">Nothing logged. Not a good sign.</div>'}</div>`;
 }
 if(otherOpen==='year'){
  const i=info(),evs=S.events.filter(e=>e.type!=='Mamba Day');
  const cairo=evs.filter(e=>e.type==='CAIRO'&&e.actualAttend).length;
  const client=evs.filter(e=>e.type==='Client Event'&&e.actualAttend).length;
  const dj=evs.filter(e=>e.type==='DJ Gig'&&e.actualAttend).length;
  const md=S.events.filter(e=>e.type==='Mamba Day'&&e.date<iso()).length;
  const closed=S.pipeline.filter(p=>['Deposit Paid','Delivered','Renewed'].includes(p.stage)).length;
  const rev=evs.reduce((s,e)=>s+evCollected(e),0);
  const bk=Object.values(S.books).filter(b=>b&&b.done).length;
  const rows=[['Weeks elapsed',i.week,52],['CAIRO editions',cairo,12],['Client events',client,12],['DJ gigs',dj,24],
   ['Sponsors closed',closed,20],['Revenue collected',rev,150000,1],['Attendees',totalAttendees(),5000],['Database captured',totalCaptured(),3000],
   ['Skill reps',S.reps.length,156],['Teardowns',S.teardowns.length,52],['Relationships',S.crm.length,150],
   ['Books read',bk,24],['Mamba Days',md,12],['Failures',S.failures.length,200]];
  el.innerHTML=back+`<div class="card"><div class="ct">Year of 24 — The Whole Arc</div>
   ${rows.map(([l,v,t,m])=>`<div class="met"><div class="met-t"><div class="met-n">${l}</div><div class="met-v"><b>${m?money(v):v}</b> / ${m?money(t):t}</div></div>
   <div class="trk"><div class="fil" style="width:${Math.min(100,v/t*100)}%"></div></div></div>`).join('')}
   <div class="note">Am I substantially more capable on August 1, 2027 than I was on August 1, 2026? That's the only question this page is trying to answer.</div></div>
   <div class="card"><div class="ct p">The Asset</div>
   <div class="big"><div class="n">${totalCaptured()}</div><div class="l">PEOPLE IN THE DATABASE</div></div>
   <div class="note" style="text-align:center;">An agency owns nothing when the campaign ends. This number is what makes CAIRO worth something.</div></div>`;
 }
 if(otherOpen==='settings'){
  el.innerHTML=back+`<div class="card"><div class="ct">Year Start Date</div>
   <div class="f"><input type="date" id="sd" value="${S.startDate}"></div><button class="bg" onclick="setStart()">Update</button></div>
  <div class="card"><div class="ct">Backup</div>
   <button class="bp" style="margin-bottom:9px;" onclick="expo()">Download Backup File</button>
   <button class="bg" onclick="document.getElementById('imp').click()">Restore From Backup</button>
   <input type="file" id="imp" accept=".json" style="display:none" onchange="impo(this)">
   <div class="note" id="bkNote">Everything lives in this browser only. Download a backup every few weeks — a year of work shouldn't depend on a cache.</div></div>
  <div class="card"><div class="ct">Reminders</div>
   <div class="sub">This app can't send push notifications on its own. Your recurring alerts live in the iPhone Reminders app: 5:15 AM God Time, 8:00 AM Build Block, 9:30 PM Visualization, Sunday 8:30 PM Review.</div></div>`;
 }
 window.scrollTo(0,0);
}
function openCRM(id){
 const c=id?S.crm.find(x=>x.id===id):{name:'',role:'',roleOther:'',org:'',tier:'B — Influences spend',info:'',lastTouch:iso(),nextTouch:'',notes:''};
 openModal(`<div class="mhead"><h3>${id?'Edit Person':'New Person'}</h3><button class="xbtn" onclick="closeModal()">×</button></div>
 <div class="f"><label>Name</label><input id="c_n" value="${esc(c.name)}"></div>
 <div class="f"><label>Organization</label><input id="c_o" value="${esc(c.org||'')}" placeholder="Cutalong · Reef Capital"></div>
 <div class="f"><label>Role</label><select id="c_r" onchange="document.getElementById('c_ro_w').style.display=this.value==='Other'?'block':'none'">
  <option value="">— pick a role —</option>${CRM_ROLES.map(r=>`<option ${c.role===r?'selected':''}>${r}</option>`).join('')}</select></div>
 <div class="f" id="c_ro_w" style="display:${c.role==='Other'?'block':'none'}"><label>Specify</label><input id="c_ro" value="${esc(c.roleOther||'')}"></div>
 <div class="f"><label>Tier</label><select id="c_t">${CRM_TIERS.map(t=>`<option ${c.tier===t?'selected':''}>${t}</option>`).join('')}</select></div>
 <div class="f"><label>Contact info</label><input id="c_i" value="${esc(c.info||'')}" placeholder="Email, phone, IG"></div>
 <div class="f2"><div class="f"><label>Last touched</label><input type="date" id="c_lt" value="${c.lastTouch||''}"></div>
 <div class="f"><label>Next touch</label><input type="date" id="c_nt" value="${c.nextTouch||''}"></div></div>
 <div class="f"><label>Notes</label><textarea id="c_no" placeholder="How you met. What they control. What they need.">${esc(c.notes||'')}</textarea></div>
 <button class="bp" onclick="saveCRM('${id||''}')">Save</button>`);}
function saveCRM(id){
 const o={name:document.getElementById('c_n').value.trim()||'Unnamed',org:document.getElementById('c_o').value,
  role:document.getElementById('c_r').value,roleOther:document.getElementById('c_ro').value,tier:document.getElementById('c_t').value,
  info:document.getElementById('c_i').value,lastTouch:document.getElementById('c_lt').value,
  nextTouch:document.getElementById('c_nt').value,notes:document.getElementById('c_no').value};
 if(id)Object.assign(S.crm.find(x=>x.id===id),o);else S.crm.push(Object.assign({id:uid()},o));
 save();closeModal();renderOtherDetail();renderOther();renderToday();}
function viewCRM(id){const c=S.crm.find(x=>x.id===id);if(!c)return;
 detailModal(c.name,(c.org||'')+(c.org&&c.role?' · ':'')+(c.role==='Other'?(c.roleOther||''):(c.role||'')),
 [['Tier',c.tier],['Contact info',c.info],['Last touched',c.lastTouch],['Next touch',c.nextTouch],['Notes',c.notes]],`delCRM('${id}')`);}
function touchCRM(id){const c=S.crm.find(x=>x.id===id);c.lastTouch=iso();save();renderOtherDetail();renderOther();renderToday();}
function delCRM(id){if(!askDelete('Delete this person?'))return;S.crm=S.crm.filter(x=>x.id!==id);save();closeModal();renderOtherDetail();renderOther();}
function logFail(){S.failures.push({id:uid(),date:iso(),type:document.getElementById('fl_t').value,note:document.getElementById('fl_n').value.trim()});
 save();renderOtherDetail();renderOther();renderToday();}
function viewFail(id){const f=S.failures.find(x=>x.id===id);if(!f)return;
 detailModal(f.type,f.date,[['What happened',f.note]],`delFail('${id}')`);}
function delFail(id){if(!askDelete('Delete this failure log? It counts toward 200.'))return;
 S.failures=S.failures.filter(x=>x.id!==id);save();closeModal();renderOtherDetail();renderOther();renderToday();}
function setStart(){const v=document.getElementById('sd').value;if(v){S.startDate=v;save();renderToday();renderOtherDetail();}}
function expo(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
 const u=URL.createObjectURL(b),a=document.createElement('a');
 a.href=u;a.download='mamba-os-backup-'+iso()+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);
 document.getElementById('bkNote').textContent='Backup downloaded '+iso()+'. Keep it somewhere safe.';}
function impo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=e=>{try{const d=JSON.parse(e.target.result);
  if(!d||typeof d!=='object'||!('events' in d)){document.getElementById('bkNote').textContent="That isn't a Mamba OS backup.";return;}
  S=Object.assign(blank(),d);save();renderToday();renderOtherDetail();renderOther();
  document.getElementById('bkNote').textContent='Restored. '+S.events.length+' events, '+Object.keys(S.days).length+' days of notes.';
 }catch(err){document.getElementById('bkNote').textContent="Couldn't read that file.";}};
 r.readAsText(f);inp.value='';}

/* =================== BOOT =================== */
load();
renderToday();
renderOther();
window.__lastDay=iso();
setInterval(()=>{const d=iso();if(d!==window.__lastDay){window.__lastDay=d;renderToday();}},60000);
</script>
