<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mamba OS">
<meta name="theme-color" content="#0A0A0C">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Mamba OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,200;0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--black:#0A0A0C;--char:#131318;--char2:#1B1B22;--char3:#25252E;--purple:#2B1E47;--purple2:#493275;--purple-lt:#9679D1;--gold:#E8B33A;--gold-dim:#9A7626;--ink:#EDE9E2;--ink-dim:#9B96A3;--ink-faint:#615C6B;--line:#26262F;--red:#B4483F;--green:#5E9B7A;--r:3px;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--black);color:var(--ink);font-family:'Newsreader',Georgia,serif;-webkit-text-size-adjust:100%;}
body{min-height:100vh;padding-bottom:calc(78px + env(safe-area-inset-bottom));}
h1,h2,h3,.dsp{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.05em;margin:0;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:'Newsreader',Georgia,serif;background:var(--char2);border:1px solid var(--line);color:var(--ink);border-radius:var(--r);padding:10px 11px;font-size:16px;width:100%;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple-lt);}
textarea{resize:vertical;min-height:70px;line-height:1.5;}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-faint) 50%),linear-gradient(135deg,var(--ink-faint) 50%,transparent 50%);background-position:calc(100% - 16px) 20px,calc(100% - 11px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
#launch{position:fixed;inset:0;z-index:200;background:var(--black);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s ease;}
#launch.gone{opacity:0;pointer-events:none;}
.quote-wrap{display:flex;flex-direction:column;align-items:center;padding:0 26px;}
.quote{font-family:'Newsreader',serif;font-weight:200;font-size:30px;line-height:1.3;color:#F2EFE9;text-align:center;}
.attrib{display:flex;align-items:center;gap:13px;margin-top:22px;font-family:'Oswald';font-size:10.5px;letter-spacing:.26em;color:var(--gold-dim);}
.attrib span{display:block;width:26px;height:1px;background:var(--gold-dim);opacity:.6;}
.launch-tap{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-family:'Oswald';font-size:10.5px;letter-spacing:.3em;color:var(--ink-faint);animation:pulse 2.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}
.launch-day{position:absolute;top:calc(26px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-family:'Oswald';font-size:11px;letter-spacing:.28em;color:var(--gold-dim);}
.topbar{padding:calc(16px + env(safe-area-inset-top)) 17px 13px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;background:rgba(10,10,12,.93);backdrop-filter:blur(12px);}
.tb-day{font-family:'Oswald';font-size:11px;letter-spacing:.2em;color:var(--gold-dim);}
.tb-title{font-family:'Oswald';font-size:23px;font-weight:600;letter-spacing:.04em;margin-top:1px;}
.tb-right{text-align:right;font-family:'JetBrains Mono';font-size:11px;color:var(--ink-faint);letter-spacing:.04em;}
.tb-right b{display:block;font-size:19px;color:var(--gold);font-weight:700;line-height:1.1;}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.screen{display:none;padding:16px 15px 24px;animation:fade .22s ease;}
.screen.on{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card{background:var(--char);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:13px;}
.ct{font-family:'Oswald';font-size:11px;letter-spacing:.18em;color:var(--gold);margin-bottom:12px;}
.ct.p{color:var(--purple-lt);}
.sub{font-size:13px;color:var(--ink-faint);font-style:italic;line-height:1.5;}
.target{background:linear-gradient(100deg,var(--purple) 0%,var(--char2) 92%);border:1px solid var(--purple2);border-left:3px solid var(--gold);border-radius:var(--r);padding:13px 15px;margin-bottom:14px;}
.target .l{font-family:'Oswald';font-size:10px;letter-spacing:.16em;color:var(--gold);}
.target .v{font-size:18px;margin-top:3px;line-height:1.3;}
.target .v.empty{color:var(--ink-faint);font-style:italic;font-size:16px;}
.task{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid var(--line);}
.task:last-child{border-bottom:none;}
.ck{width:23px;height:23px;flex:0 0 23px;border:1.5px solid var(--gold-dim);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.ck.on{background:var(--gold);border-color:var(--gold);}
.ck.on::after{content:"✓";color:var(--black);font-size:13px;font-weight:700;font-family:'Oswald';}
.ck.sq{border-radius:3px;width:21px;height:21px;flex:0 0 21px;}
.tl{flex:1;font-size:16.5px;line-height:1.25;}
.tl small{display:block;color:var(--ink-faint);font-size:12.5px;font-style:italic;margin-top:2px;line-height:1.35;}
.task.done .tl{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:var(--gold-dim);}
.task.done .tl small{text-decoration:none;}
.task .go{font-family:'Oswald';font-size:9.5px;letter-spacing:.14em;color:var(--purple-lt);border:1px solid var(--purple2);padding:4px 8px;border-radius:20px;}
.xbtn{color:var(--ink-faint);font-size:19px;padding:0 4px;line-height:1;}
.bp{width:100%;background:var(--gold);color:var(--black);padding:13px;border-radius:var(--r);font-family:'Oswald';font-size:12.5px;letter-spacing:.12em;font-weight:600;text-transform:uppercase;}
.bg{width:100%;background:transparent;color:var(--ink-dim);border:1px solid var(--line);padding:12px;border-radius:var(--r);font-family:'Oswald';font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;}
.bpp{width:100%;background:var(--purple2);color:#fff;padding:12px;border-radius:var(--r);font-family:'Oswald';font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;}
.bsm{font-family:'Oswald';font-size:10px;letter-spacing:.12em;color:var(--gold-dim);text-transform:uppercase;}
.brow{display:flex;gap:9px;}
.cbtn{flex:1;text-align:center;text-decoration:none;font-family:'Oswald';font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-dim);padding:12px 0;border-radius:var(--r);background:rgba(232,179,58,.07);}
.f{margin-bottom:11px;}
.f label{display:block;font-family:'Oswald';font-size:10px;letter-spacing:.13em;color:var(--ink-faint);margin-bottom:5px;text-transform:uppercase;}
.f2{display:flex;gap:9px;}
.f2>div{flex:1;}
.seg{display:flex;gap:5px;overflow-x:auto;padding-bottom:11px;margin-bottom:3px;scrollbar-width:none;}
.seg::-webkit-scrollbar{display:none;}
.seg button{flex:0 0 auto;background:var(--char2);border:1px solid var(--line);color:var(--ink-dim);font-family:'Oswald';font-size:10.5px;letter-spacing:.1em;padding:8px 13px;border-radius:20px;text-transform:uppercase;}
.seg button.on{background:var(--gold);border-color:var(--gold);color:var(--black);}
.lr{display:flex;gap:12px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);}
.lr:last-child{border-bottom:none;}
.lr-date{flex:0 0 46px;text-align:center;}
.lr-date .d{font-family:'Oswald';font-size:19px;font-weight:600;line-height:1;color:var(--gold);}
.lr-date .m{font-family:'Oswald';font-size:9.5px;letter-spacing:.13em;color:var(--ink-faint);margin-top:2px;}
.lr-mid{flex:1;min-width:0;}
.lr-mid b{font-family:'Oswald';font-size:15px;letter-spacing:.02em;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lr-mid span{font-size:12.5px;color:var(--ink-faint);font-style:italic;}
.lr-next{flex:0 0 auto;max-width:38%;text-align:right;font-family:'Oswald';font-size:9.5px;letter-spacing:.09em;color:var(--purple-lt);line-height:1.3;text-transform:uppercase;}
.lr-next.done{color:var(--green);}
.met{margin-bottom:13px;}
.met:last-child{margin-bottom:0;}
.met-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.met-n{font-family:'Oswald';font-size:11.5px;letter-spacing:.07em;}
.met-v{font-family:'JetBrains Mono';font-size:12px;color:var(--ink-faint);}
.met-v b{color:var(--gold);}
.trk{height:6px;background:var(--char2);border-radius:4px;overflow:hidden;border:1px solid var(--line);}
.fil{height:100%;background:linear-gradient(90deg,var(--purple2),var(--gold));transition:width .35s;}
.fil.p{background:linear-gradient(90deg,var(--purple),var(--purple-lt));}
.fil.g{background:linear-gradient(90deg,var(--green),#7FC49F);}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);margin-top:6px;}
.stp button{background:var(--char2);color:var(--gold);width:34px;height:30px;font-size:17px;line-height:1;}
.stp input{border:none;width:52px;text-align:center;background:var(--char);padding:5px 0;font-size:14px;font-family:'JetBrains Mono';-moz-appearance:textfield;}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.wk{display:flex;gap:6px;}
.wk div{flex:1;text-align:center;padding:9px 0;border-radius:var(--r);font-family:'JetBrains Mono';font-size:11px;border:1px solid var(--line);background:var(--char2);color:var(--ink-faint);}
.wk div.on{border-color:var(--gold);background:rgba(232,179,58,.14);color:var(--gold);}
.ent{background:var(--char);border:1px solid var(--line);border-left:3px solid var(--sc,var(--ink-faint));border-radius:var(--r);padding:13px;margin-bottom:10px;}
.ent-top{display:flex;justify-content:space-between;gap:9px;align-items:flex-start;}
.ent-t{font-family:'Oswald';font-size:15.5px;font-weight:500;}
.pill{font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:20px;border:1px solid currentColor;white-space:nowrap;}
.ent-m{font-size:12.5px;color:var(--ink-faint);font-style:italic;margin-top:4px;}
.ent-b{font-size:14px;color:var(--ink-dim);margin-top:7px;line-height:1.5;}
.acts{display:flex;gap:15px;margin-top:9px;}
.rate{display:flex;gap:4px;}
.rate button{flex:1;height:28px;border:1px solid var(--line);background:var(--char2);border-radius:2px;font-family:'JetBrains Mono';font-size:10px;color:var(--ink-faint);}
.rate button.on{background:var(--gold);border-color:var(--gold);color:var(--black);font-weight:700;}
.tags{display:flex;flex-wrap:wrap;gap:5px;}
.tag{font-family:'Oswald';font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:20px;border:1px solid var(--purple2);color:var(--purple-lt);}
.tag.g{border-color:var(--gold-dim);color:var(--gold);}
.tagsel{display:flex;flex-wrap:wrap;gap:5px;}
.tagsel button{font-family:'Oswald';font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:20px;border:1px solid var(--line);background:var(--char2);color:var(--ink-faint);}
.tagsel button.on{border-color:var(--gold);background:rgba(232,179,58,.14);color:var(--gold);}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.st{background:var(--char2);border:1px solid var(--line);border-radius:var(--r);padding:12px;}
.st .n{font-family:'Oswald';font-size:25px;font-weight:600;color:var(--gold);line-height:1;}
.st .n.sm{font-size:20px;}
.st .n small{font-size:13px;color:var(--ink-faint);font-weight:400;}
.st .l{font-family:'Oswald';font-size:9.5px;letter-spacing:.13em;color:var(--ink-faint);margin-top:5px;text-transform:uppercase;}
.big{text-align:center;padding:6px 0 2px;}
.big .n{font-family:'Oswald';font-size:54px;font-weight:700;color:var(--gold);line-height:1;}
.big .l{font-family:'Oswald';font-size:10.5px;letter-spacing:.22em;color:var(--ink-faint);margin-top:6px;}
.mbg{position:fixed;inset:0;background:rgba(5,5,7,.8);z-index:100;display:none;align-items:flex-end;backdrop-filter:blur(3px);}
.mbg.on{display:flex;}
.mod{background:var(--char);border-top:1px solid var(--purple2);width:100%;max-height:90vh;overflow-y:auto;padding:18px 16px calc(30px + env(safe-area-inset-bottom));border-radius:12px 12px 0 0;animation:up .22s ease;}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.mod h3{font-size:16px;margin-bottom:15px;}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;}
.q{margin-bottom:15px;}
.q label{display:block;font-family:'Newsreader';font-style:italic;color:var(--gold);font-size:15.5px;margin-bottom:7px;line-height:1.35;}
.flag{background:rgba(180,72,63,.12);border:1px solid var(--red);border-radius:var(--r);padding:10px 12px;margin-bottom:13px;font-size:13.5px;color:#E5A9A3;line-height:1.45;}
.flag.gold{background:rgba(232,179,58,.1);border-color:var(--gold-dim);color:#E8CE9B;}
.carry{background:var(--char2);border-left:2px solid var(--purple2);padding:8px 11px;margin-bottom:8px;font-size:13px;color:var(--ink-dim);font-style:italic;}
.bk{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);}
.bk:last-child{border-bottom:none;}
.bkc{width:19px;height:19px;flex:0 0 19px;border:1.5px solid var(--gold-dim);border-radius:2px;}
.bkc.on{background:var(--gold);border-color:var(--gold);}
.bkc.on::after{content:"✓";color:var(--black);font-size:11px;display:block;text-align:center;line-height:16px;font-weight:700;font-family:'Oswald';}
.bki{flex:1;min-width:0;}
.bki b{font-size:14.5px;font-weight:500;}
.bki span{display:block;font-size:12px;color:var(--ink-faint);font-style:italic;}
.bkm{font-family:'JetBrains Mono';font-size:10px;color:var(--ink-faint);}
.acc{background:var(--char2);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-top:11px;}
.menu button{width:100%;display:flex;align-items:center;justify-content:space-between;padding:16px 2px;border-bottom:1px solid var(--line);text-align:left;}
.menu button:last-child{border-bottom:none;}
.menu .mi b{font-family:'Oswald';font-size:15px;font-weight:500;letter-spacing:.03em;display:block;}
.menu .mi span{font-size:12.5px;color:var(--ink-faint);font-style:italic;}
.menu .ar{color:var(--ink-faint);font-size:17px;}
.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(19,19,24,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:64px;color:var(--ink-faint);}
.tab.on{color:var(--gold);}
.tab .tt{font-family:'Oswald';font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;}
.tab svg{width:19px;height:19px;}
.empty{text-align:center;padding:26px 12px;color:var(--ink-faint);font-style:italic;font-size:14px;line-height:1.5;}
.hr{height:1px;background:var(--line);margin:15px 0;}
.note{font-size:12.5px;color:var(--ink-faint);font-style:italic;line-height:1.5;margin-top:8px;}
.back{font-family:'Oswald';font-size:10.5px;letter-spacing:.14em;color:var(--purple-lt);text-transform:uppercase;margin-bottom:13px;display:inline-block;}
.cairo{background:linear-gradient(140deg,var(--purple) 0%,var(--char) 75%);border:1px solid var(--purple2);border-radius:var(--r);padding:17px;margin-bottom:13px;}
.cairo .nm{font-family:'Oswald';font-size:30px;font-weight:700;letter-spacing:.18em;color:var(--gold);line-height:1;}
.cairo .fm{font-size:14px;color:var(--ink-dim);font-style:italic;margin-top:6px;}
.spon{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
.spon:last-child{border-bottom:none;}
.spon b{font-family:'Oswald';font-size:14px;font-weight:500;}
.spon .tr{font-size:11.5px;color:var(--ink-faint);font-style:italic;}
.spon .amt{font-family:'Oswald';font-size:15px;color:var(--gold);}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;}
</style>
</head>
<body>
<div id="launch" onclick="enterApp()">
  <div class="launch-day" id="launchDay"></div>
  <div class="quote-wrap">
    <div class="quote">Obsession beats talent.</div>
    <div class="attrib"><span></span>KOBE BRYANT &nbsp;·&nbsp; NO. 24<span></span></div>
  </div>
  <div class="launch-tap">TAP TO ENTER</div>
</div>

<div class="topbar">
  <div class="row">
    <div><div class="tb-day" id="tbDay">DAY 1 · WEEK 1</div><div class="tb-title" id="tbTitle">Today</div></div>
    <div class="tb-right"><b id="tbPct">0%</b>WEEK</div>
  </div>
</div>

<div class="screen on" id="s-today">
  <div class="target" onclick="go('review')"><div class="l">THIS WEEK'S ATTACK TARGETS</div><div class="v" id="tgt">—</div></div>
  <div class="card"><div class="ct" id="todayLabel">TODAY</div><div id="coreList"></div></div>
  <div class="card"><div class="ct">This Week</div><div id="weeklyList"></div></div>
  <div class="card">
    <div class="ct">Also Today</div><div id="extraList"></div>
    <div class="f2" style="margin-top:11px;"><div><input id="newTask" placeholder="Add a task for today" onkeydown="if(event.key==='Enter')addExtra()"></div>
    <div style="flex:0 0 74px;"><button class="bp" style="padding:11px 0;" onclick="addExtra()">Add</button></div></div>
  </div>
  <div class="card" id="chopCard">
    <div class="ct" style="color:var(--red);">Chopping Block</div>
    <div id="chopList"></div>
    <div class="note">Yesterday's unfinished tasks. Do them, move them up, or let them die tonight.</div>
  </div>
  <div class="card">
    <div class="ct">Daily Notes</div>
    <textarea id="dayNotes" placeholder="What happened today. Who you talked to. What you noticed." oninput="saveNotes()" style="min-height:130px;"></textarea>
    <div class="note" id="notesSaved">Saved automatically to this date.</div>
    <div class="hr"></div><button class="bg" onclick="openPastNotes()">Read Past Notes</button>
  </div>
</div>

<div class="screen" id="s-events"><div class="seg" id="evSeg"></div><div id="evBody"></div></div>

<div class="screen" id="s-lab">
  <div class="seg" id="labMode" style="padding-bottom:6px;"></div>
  <div class="seg" id="labSeg"></div>
  <div id="labBody"></div>
</div>

<div class="screen" id="s-review"><div class="seg" id="revSeg"></div><div id="revBody"></div></div>

<div class="screen" id="s-other">
  <div id="otherMain">
    <div class="card"><div class="ct">Mamba Day</div><div id="mambaCountdown"></div></div>
    <div id="otherMenu"></div>
  </div>
  <div id="otherDetail" style="display:none;"></div>
</div>

<div class="tabs">
  <button class="tab on" data-s="today" onclick="go('today')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="tt">Today</span></button>
  <button class="tab" data-s="events" onclick="go('events')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="tt">Events</span></button>
  <button class="tab" data-s="lab" onclick="go('lab')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 3h6M10 3v6L5 18a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/></svg><span class="tt">The Lab</span></button>
  <button class="tab" data-s="review" onclick="go('review')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 4h14v16l-7-4-7 4V4z"/></svg><span class="tt">Review</span></button>

/* chopping block: yesterday's unchecked to-dos roll in, yesterday's chop dies */
function rollover(){
 const today=iso();
 if(S.lastRollover===today)return;
 const keys=Object.keys(S.days).filter(k=>k<today).sort();
 if(keys.length){
  const prev=S.days[keys[keys.length-1]];
  const left=(prev.extras||[]).filter(x=>!x.done);
  const d=day(today);
  if(left.length&&!d.chop.length)d.chop=left.map(x=>({id:uid(),text:x.text,done:false}));

 S.lastRollover=today;save();
}

   <div class="tl" onclick="toggleCore('${it.k}')">${it.n}${it.s?`<small>${esc(it.s)}</small>`:''}</div>
   ${it.go?`<button class="go" onclick="event.stopPropagation();go('${it.go}')">OPEN</button>`:''}</div>`).join('');
 const w=week(i.week);
 document.getElementById('weeklyList').innerHTML=weeklyItems().map(it=>`
  <div class="task ${w.tasks[it.k]?'done':''}">

   <div class="tl" onclick="toggleWeekly('${it.k}')">${it.n}${it.s?`<small>${esc(it.s)}</small>`:''}</div></div>`).join('');
 const ex=document.getElementById('extraList');
 ex.innerHTML=d.extras.length?d.extras.map(e=>`<div class="task ${e.done?'done':''}">
   <div class="ck ${e.done?'on':''}" onclick="toggleExtra('${e.id}')"></div>
   <div class="tl" onclick="toggleExtra('${e.id}')">${esc(e.text)}</div>
   <button class="xbtn" onclick="delExtra('${e.id}')">×</button></div>`).join(''):'<div class="empty" style="padding:12px;">Nothing extra today.</div>';
 const cc=document.getElementById('chopCard');
 if(d.chop.length){cc.style.display='block';
  document.getElementById('chopList').innerHTML=d.chop.map(c=>`<div class="task ${c.done?'done':''}">
   <div class="ck ${c.done?'on':''}" onclick="toggleChop('${c.id}')"></div>
   <div class="tl" onclick="toggleChop('${c.id}')" style="font-size:15px;">${esc(c.text)}</div>
   <button class="go" onclick="event.stopPropagation();promoteChop('${c.id}')">TODAY</button></div>`).join('');
 }else cc.style.display='none';
 document.getElementById('dayNotes').value=d.notes||'';

function toggleCore(k){const d=day(),i=info();d.core[k]=!d.core[k];
 if(k==='god')week(i.week).god[new Date().getDay()]=d.core[k];
 if(k==='workout'||k==='yoga')week(i.week).wo[new Date().getDay()]=d.core[k];
 save();renderToday();}
function toggleWeekly(k){const w=week(info().week);w.tasks[k]=!w.tasks[k];save();renderToday();}
function addExtra(){const el=document.getElementById('newTask'),v=el.value.trim();if(!v)return;day().extras.push({id:uid(),text:v,done:false});el.value='';save();renderToday();}
function toggleExtra(id){const e=day().extras.find(x=>x.id===id);e.done=!e.done;save();renderToday();}
function delExtra(id){const d=day();d.extras=d.extras.filter(x=>x.id!==id);save();renderToday();}
function toggleChop(id){const c=day().chop.find(x=>x.id===id);c.done=!c.done;save();renderToday();}
function promoteChop(id){const d=day(),c=d.chop.find(x=>x.id===id);
 d.extras.push({id:uid(),text:c.text,done:false});d.chop=d.chop.filter(x=>x.id!==id);save();renderToday();}
let noteTimer;
function saveNotes(){day().notes=document.getElementById('dayNotes').value;clearTimeout(noteTimer);
 noteTimer=setTimeout(()=>{save();const n=document.getElementById('notesSaved');n.textContent='Saved.';setTimeout(()=>n.textContent='Saved automatically to this date.',1400);},450);}
function openPastNotes(){

 openModal(`<div class="mhead"><h3>Past Notes</h3><button class="xbtn" onclick="closeModal()">×</button></div>
 ${ks.length?ks.map(k=>`<div style="border-bottom:1px solid var(--line);padding:11px 0;" onclick="viewNote('${k}')">
  <div class="row"><span class="bsm" style="color:var(--gold-dim);">${parseD(k).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</span><span class="bsm">›</span></div>
  <div style="font-size:14px;color:var(--ink-dim);line-height:1.5;margin-top:4px;white-space:pre-wrap;">${esc(S.days[k].notes.slice(0,180))}${S.days[k].notes.length>180?'…':''}</div></div>`).join(''):'<div class="empty">No notes yet.</div>'}`);}
function viewNote(k){const d=S.days[k];if(!d)return;
 detailModal(parseD(k).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}),k,[['Notes',d.notes]],`delNote('${k}')`);}

function renderEvents(){
 document.getElementById('evSeg').innerHTML=[['events','Events'],['pipeline','Pipeline'],['money','Money']]
  .map(([k,l])=>`<button class="${evTab===k?'on':''}" onclick="evTab='${k}';evOpen=null;pipeOpen=null;renderEvents()">${l}</button>`).join('');
 const b=document.getElementById('evBody');
 if(evOpen){b.innerHTML=eventDetail();return;}
 if(pipeOpen){b.innerHTML=pipeDetail();return;}
 b.innerHTML=evTab==='events'?evList():evTab==='pipeline'?pipeList():moneyView();
}
function nextEvTask(e){
 if(e.type==='Mamba Day')return e.debriefNotes?'LOGGED':(e.objective?'READY':'SET OBJECTIVE');
 const f=evChecklist(e).find(([k])=>!e.check||!e.check[k]);
 return f?f[1].toUpperCase():'COMPLETE';
}
function evList(){
 const today=iso();
 const up=S.events.filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date));
 const pa=S.events.filter(e=>e.date<today).sort((a,b)=>b.date.localeCompare(a.date));
 const nextC=up.find(e=>e.type==='CAIRO Event');
 const row=e=>{const d=parseD(e.date),nt=nextEvTask(e),done=nt==='COMPLETE'||nt==='LOGGED';
  return `<div class="lr" onclick="evOpen='${e.id}';renderEvents()">
   <div class="lr-date"><div class="d" style="color:${TYPE_C[e.type]||'var(--gold)'}">${d.getDate()}</div><div class="m">${MON[d.getMonth()]}</div></div>
   <div class="lr-mid"><b>${esc(e.name)}</b><span>${esc(e.venue||e.type)}${evRevenue(e)?' · '+money(evRevenue(e)):''}</span></div>
   <div class="lr-next ${done?'done':''}">${nt}</div></div>`;};
 return `
 <div class="cairo">
   <div class="nm">CAIRO</div>
   <div class="fm">${S.cairoFormat?esc(S.cairoFormat):'Format not defined yet — this is the blocker.'}</div>
   ${nextC?`<div class="row" style="margin-top:14px;padding-top:13px;border-top:1px solid var(--purple2);">
     <div><div class="bsm" style="color:var(--gold);">NEXT EDITION</div><div style="font-size:16px;margin-top:2px;">${esc(nextC.name)}</div></div>
     <div style="text-align:right;"><div style="font-family:'Oswald';font-size:26px;color:var(--gold);line-height:1;">${Math.max(0,Math.round((parseD(nextC.date)-parseD(iso()))/864e5))}</div><div class="bsm">DAYS</div></div></div>`:''}
   <button class="bg" style="margin-top:13px;" onclick="editFormat()">${S.cairoFormat?'Edit Format':'Define The Format'}</button>
 </div>
 <div class="brow" style="margin-bottom:13px;">
   <button class="bp" onclick="openEvent()">+ Event</button>
   <button class="bpp" onclick="openEvent(null,'Mamba Day')">+ Mamba Day</button>
 </div>
 <div class="card"><div class="ct">Upcoming</div>${up.length?up.map(row).join(''):'<div class="empty">Nothing booked yet.</div>'}</div>
 <div class="card"><div class="ct" style="color:var(--ink-faint);">Past</div>${pa.length?pa.map(row).join(''):'<div class="empty">No past events.</div>'}</div>`;
}

 if(isM){o.type='Mamba Day';}
 else{o.type=document.getElementById('e_type').value;o.venue=document.getElementById('e_venue').value;

  o.fee=document.getElementById('e_fee').value;o.cost=document.getElementById('e_cost').value;
  o.cname=document.getElementById('e_cname').value;o.cphone=document.getElementById('e_cphone').value;o.cemail=document.getElementById('e_cemail').value;}
 if(id)Object.assign(S.events.find(x=>x.id===id),o);
 else S.events.push(Object.assign({id:uid(),check:{},sponsors:[],runsheet:[],debrief:{},notes:''},o));
 save();closeModal();renderEvents();renderOther();}

function bSummary(){

 const sorted=Object.entries(dim).sort((a,b)=>a[1]-b[1]);
 const att=S.events.filter(e=>e.actualAttend&&e.projAttend);
 const acc=att.length?Math.round(att.reduce((s,e)=>s+e.actualAttend/e.projAttend,0)/att.length*100):null;
 return `

   <div class="note">Look at what they share — venue, day, price, sponsor count, format. That's the repeatable part.</div>`
   :`<div class="sub">Debrief at least two events and this starts working. ${run.length} scored so far.</div>`}</div>
 ${sorted.length?`<div class="card"><div class="ct">Scored Across Every Event</div>
  ${sorted.map(([l,v])=>`<div class="met"><div class="met-t"><div class="met-n">${l}</div><div class="met-v"><b>${v}</b> / 10</div></div>

function cSummary(){
 const rated=S.songs.filter(s=>Object.values(s.ratings||{}).filter(Boolean).length>=3);
 const avgOf=s=>{const r=Object.values(s.ratings).filter(Boolean);return r.reduce((a,b)=>a+b,0)/r.length;};
 const best=rated.filter(s=>avgOf(s)>=7.5);
 const tally={};best.forEach(s=>s.tags.forEach(t=>tally[t]=(tally[t]||0)+1));
 const top=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
 const selfT={},outT={};
 S.songs.forEach(s=>{(s.self||[]).forEach(n=>selfT[n.tag]=(selfT[n.tag]||0)+1);(s.outside||[]).forEach(n=>outT[n.tag]=(outT[n.tag]||0)+1);});
 const sS=Object.entries(selfT).sort((a,b)=>b[1]-a[1]),oS=Object.entries(outT).sort((a,b)=>b[1]-a[1]);
 const blind=oS.length&&sS.length&&oS[0][0]!==sS[0][0];
 const bar=(t,c,max,p)=>`<div class="met"><div class="met-t"><div class="met-n">${esc(t)}</div><div class="met-v"><b>${c}</b></div></div><div class="trk"><div class="fil ${p?'p':''}" style="width:${c/max*100}%"></div></div></div>`;
 return `
 <div class="card"><div class="ct">Your Sound, By Evidence</div>
  ${best.length>=4?`<div style="font-size:15.5px;line-height:1.6;">Your ${best.length} strongest records share:</div>
   <div class="tags" style="margin-top:11px;">${top.slice(0,7).map(([t,c])=>`<span class="tag g">${esc(t)} · ${c}</span>`).join('')}</div>
   <div class="note">Not a genre you picked. A pattern in what you actually make well.</div>`
   :`<div class="sub">Rate at least four records 7.5+ and the pattern shows. ${rated.length} rated, ${best.length} strong.</div>`}</div>
 <div class="card"><div class="ct">What You Hear</div>
  ${sS.length?sS.slice(0,6).map(([t,c])=>bar(t,c,sS[0][1],false)).join(''):'<div class="sub">No self-critique logged.</div>'}</div>
 <div class="card"><div class="ct p">What They Hear</div>
  ${oS.length?oS.slice(0,6).map(([t,c])=>bar(t,c,oS[0][1],true)).join(''):'<div class="sub">No outside feedback logged.</div>'}</div>
 ${blind?`<div class="flag"><b style="font-family:'Oswald';letter-spacing:.06em;">BLIND SPOT</b><br>You keep flagging <b>${esc(sS[0][0])}</b>. They keep flagging <b>${esc(oS[0][0])}</b>. Trust theirs — that's what you can't hear in your own work.</div>`:''}
 ${oS.length?`<div class="card"><div class="ct">Next Training Block</div>
  <div style="font-size:16px;line-height:1.5;">Most-repeated outside note: <b style="color:var(--gold)">${esc(oS[0][0])}</b> — ${oS[0][1]} mention${oS[0][1]>1?'s':''}.</div>
  <div class="note">If it shows up eight times, that's not eight notes. That's your next weakness.</div></div>`:''}`;
}

function repeatFlag(){const i=info(),ws=[];
 for(let n=i.week-1;n>=Math.max(1,i.week-3);n--){const r=S.reviews['w'+n];if(r&&r.weakness)ws.push(r.weakness);}
 return(ws.length>=3&&ws[0]===ws[1]&&ws[1]===ws[2])?ws[0]:null;}
function revWeekly(){

 }
 if(otherOpen==='fail'){
  const biz=S.failures.filter(f=>f.domain!=='music'),mus=S.failures.filter(f=>f.domain==='music');
  const list=(arr,color)=>arr.length?arr.slice().reverse().map(f=>`<div style="border-bottom:1px solid var(--line);padding:9px 0;" onclick="viewFail('${f.id}')">
    <div class="row"><span class="pill" style="color:${color}">${esc(f.type)}</span><span class="bsm">${f.date.slice(5)} ›</span></div>
    ${f.note?`<div class="ent-b">${esc(f.note)}</div>`:''}</div>`).join(''):'<div class="empty">Nothing logged. Not a good sign.</div>';
  el.innerHTML=back+`
  <div class="card"><div class="big"><div class="n">${S.failures.length}</div><div class="l">OF 200 THIS YEAR</div></div>
   <div class="trk" style="margin-top:14px;"><div class="fil" style="width:${Math.min(100,S.failures.length/200*100)}%"></div></div>
   <div class="sg" style="margin-top:14px;">
    <div class="st"><div class="n">${biz.length}</div><div class="l">CAIRO</div></div>
    <div class="st"><div class="n">${mus.length}</div><div class="l">Studio</div></div></div>
   <div class="note" style="text-align:center;">${S.failures.length} toward 30,000 in a lifetime. Every no moves it.</div></div>
  <div class="card"><div class="ct">Log a Failure</div>
   <div class="f"><label>Where</label><select id="fl_dom"><option value="business">CAIRO</option><option value="music">Studio</option></select></div>
   <div class="f"><label>Type</label><select id="fl_t"><option>Rejection</option><option>Ignored</option><option>Deal lost</option><option>Event underperformed</option><option>Pitch fell flat</option><option>Song abandoned</option><option>Bad set</option><option>Uncomfortable ask</option><option>Failed experiment</option></select></div>
   <div class="f"><label>What happened</label><input id="fl_n" placeholder="Emailed a GM I thought was out of reach. No reply."></div>
   <button class="bp" onclick="logFail()">Log It</button>
   <div class="note">This is the only number where up is good.</div></div>
  <div class="card"><div class="ct">CAIRO</div>${list(biz,'var(--red)')}</div>
  <div class="card"><div class="ct p">Studio</div>${list(mus,'var(--purple-lt)')}</div>`;
 }
 if(otherOpen==='year'){
  const i=info(),evs=S.events.filter(e=>e.type!=='Mamba Day');
  const cairo=evs.filter(e=>e.type==='CAIRO Event'&&e.actualAttend).length;
  const gigs=evs.filter(e=>(DJ_TYPES.includes(e.type)||e.type==='Private Client Event')&&e.date<iso()).length;
  const md=S.events.filter(e=>e.type==='Mamba Day'&&e.date<iso()).length;
  const closed=S.pipeline.filter(p=>['Deposit Paid','Delivered','Renewed'].includes(p.stage)).length;
  const rev=evs.reduce((s,e)=>s+evCollected(e),0);
  const bk=Object.values(S.books).filter(b=>b&&b.done).length;
  const temple=Object.values(S.weeks).filter(w=>w.tasks&&w.tasks.temple).length;
  const rows=[['Weeks elapsed',i.week,52],['CAIRO editions',cairo,12],['Gigs played',gigs,48],['Sponsors closed',closed,20],
   ['Revenue collected',rev,150000,1],['Attendees',totalAttendees(),5000],['Database captured',totalCaptured(),3000],
   ['Songs finished',S.songs.filter(s=>s.finishedOn).length,52],['Build reps',S.reps.length,156],['Cook reps',S.cookReps.length,156],
   ['Breakdowns',S.teardowns.length,52],['Reference analyses',S.analyses.length,52],['Relationships',S.crm.length,150],
   ['Temple weeks',temple,52],['Books read',bk,24],['Mamba Days',md,12],['Failures',S.failures.length,200]];
  el.innerHTML=back+`<div class="card"><div class="ct">Year of 24 — The Whole Arc</div>
   ${rows.map(([l,v,t,m])=>`<div class="met"><div class="met-t"><div class="met-n">${l}</div><div class="met-v"><b>${m?money(v):v}</b> / ${m?money(t):t}</div></div>
   <div class="trk"><div class="fil ${v>=t?'g':''}" style="width:${Math.min(100,v/t*100)}%"></div></div></div>`).join('')}
   <div class="note">Am I substantially more capable on August 1, 2027 than I was on August 1, 2026? That's the only question this page is trying to answer.</div></div>
   <div class="card"><div class="ct p">The Asset</div>
   <div class="big"><div class="n">${totalCaptured()}</div><div class="l">PEOPLE IN THE DATABASE</div></div>
   <div class="note" style="text-align:center;">An agency owns nothing when the campaign ends. This number is what makes CAIRO worth something.</div></div>`;
 }
 if(otherOpen==='settings'){
  el.innerHTML=back+`<div class="card"><div class="ct">Year Start Date</div>
   <div class="f"><input type="date" id="sd" value="${S.startDate}"></div><button class="bg" onclick="setStart()">Update</button></div>
  <div class="card"><div class="ct">Backup</div>
   <button class="bp" style="margin-bottom:9px;" onclick="expo()">Download Backup File</button>
   <button class="bg" onclick="document.getElementById('imp').click()">Restore From Backup</button>
   <input type="file" id="imp" accept=".json" style="display:none" onchange="impo(this)">
   <div class="note" id="bkNote">Everything lives in this browser only. Download a backup every few weeks — a year of work shouldn't depend on a cache.</div></div>
  <div class="card"><div class="ct">Reminders</div>
   <div class="sub">This app can't send push notifications on its own. Your recurring alerts live in the iPhone Reminders app: 5:15 AM God Time, 9:30 PM wind-down, Sunday 8:30 PM Review.</div></div>`;
 }
 window.scrollTo(0,0);
}
function openCRM(id){
 const c=id?S.crm.find(x=>x.id===id):{name:'',role:'',roleOther:'',org:'',tier:'B — Influences spend',info:'',lastTouch:iso(),nextTouch:'',notes:''};
 openModal(`<div class="mhead"><h3>${id?'Edit Person':'New Person'}</h3><button class="xbtn" onclick="closeModal()">×</button></div>
 <div class="f"><label>Name</label><input id="c_n" value="${esc(c.name)}"></div>
 <div class="f"><label>Organization</label><input id="c_o" value="${esc(c.org||'')}" placeholder="Cutalong · Reef Capital"></div>
 <div class="f"><label>Role</label><select id="c_r" onchange="document.getElementById('c_ro_w').style.display=this.value==='Other'?'block':'none'">
  <option value="">— pick a role —</option>${CRM_ROLES.map(r=>`<option ${c.role===r?'selected':''}>${r}</option>`).join('')}</select></div>
 <div class="f" id="c_ro_w" style="display:${c.role==='Other'?'block':'none'}"><label>Specify</label><input id="c_ro" value="${esc(c.roleOther||'')}"></div>
 <div class="f"><label>Tier</label><select id="c_t">${CRM_TIERS.map(t=>`<option ${c.tier===t?'selected':''}>${t}</option>`).join('')}</select></div>
 <div class="f"><label>Contact info</label><input id="c_i" value="${esc(c.info||'')}" placeholder="Email, phone, IG"></div>
 <div class="f2"><div class="f"><label>Last touched</label><input type="date" id="c_lt" value="${c.lastTouch||''}"></div>
 <div class="f"><label>Next touch</label><input type="date" id="c_nt" value="${c.nextTouch||''}"></div></div>
 <div class="f"><label>Notes</label><textarea id="c_no" placeholder="How you met. What they control. What they need.">${esc(c.notes||'')}</textarea></div>
 <button class="bp" onclick="saveCRM('${id||''}')">Save</button>`);}
function saveCRM(id){
 const o={name:document.getElementById('c_n').value.trim()||'Unnamed',org:document.getElementById('c_o').value,
  role:document.getElementById('c_r').value,roleOther:document.getElementById('c_ro').value,tier:document.getElementById('c_t').value,
  info:document.getElementById('c_i').value,lastTouch:document.getElementById('c_lt').value,
  nextTouch:document.getElementById('c_nt').value,notes:document.getElementById('c_no').value};
 if(id)Object.assign(S.crm.find(x=>x.id===id),o);else S.crm.push(Object.assign({id:uid()},o));
 save();closeModal();renderOtherDetail();renderOther();renderToday();}
function viewCRM(id){const c=S.crm.find(x=>x.id===id);if(!c)return;
 detailModal(c.name,(c.org||'')+(c.org&&c.role?' · ':'')+(c.role==='Other'?(c.roleOther||''):(c.role||'')),
 [['Tier',c.tier],['Contact info',c.info],['Last touched',c.lastTouch],['Next touch',c.nextTouch],['Notes',c.notes]],`delCRM('${id}')`);}
function touchCRM(id){const c=S.crm.find(x=>x.id===id);c.lastTouch=iso();save();renderOtherDetail();renderOther();renderToday();}
function delCRM(id){if(!askDelete('Delete this person?'))return;S.crm=S.crm.filter(x=>x.id!==id);save();closeModal();renderOtherDetail();renderOther();}
function logFail(){S.failures.push({id:uid(),date:iso(),domain:document.getElementById('fl_dom').value,
 type:document.getElementById('fl_t').value,note:document.getElementById('fl_n').value.trim()});
 save();renderOtherDetail();renderOther();renderToday();}
function viewFail(id){const f=S.failures.find(x=>x.id===id);if(!f)return;
 detailModal(f.type,f.date+' · '+(f.domain==='music'?'Studio':'CAIRO'),[['What happened',f.note]],`delFail('${id}')`);}
function delFail(id){if(!askDelete('Delete this failure log? It counts toward 200.'))return;
 S.failures=S.failures.filter(x=>x.id!==id);save();closeModal();renderOtherDetail();renderOther();renderToday();}
function setStart(){const v=document.getElementById('sd').value;if(v){S.startDate=v;save();renderToday();renderOtherDetail();}}
function expo(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
 const u=URL.createObjectURL(b),a=document.createElement('a');
 a.href=u;a.download='mamba-os-backup-'+iso()+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);
 document.getElementById('bkNote').textContent='Backup downloaded '+iso()+'. Keep it somewhere safe.';}
function impo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=e=>{try{const d=JSON.parse(e.target.result);
  if(!d||typeof d!=='object'||!('events' in d)){document.getElementById('bkNote').textContent="That isn't a Mamba OS backup.";return;}
  S=Object.assign(blank(),d);save();renderToday();renderOtherDetail();renderOther();
  document.getElementById('bkNote').textContent='Restored. '+S.events.length+' events, '+S.songs.length+' records.';
 }catch(err){document.getElementById('bkNote').textContent="Couldn't read that file.";}};
 r.readAsText(f);inp.value='';}

/* =================== BOOT =================== */
load();
renderToday();
renderOther();
window.__lastDay=iso();
setInterval(()=>{const d=iso();if(d!==window.__lastDay){window.__lastDay=d;rollover();renderToday();}},60000);
</script>
</body>
</html>
